            - listitem [ref=f21e156]: "Fotos de los conductores: TODO: pendientes de producción."
          - heading "Descripción en 50 palabras" [level=3] [ref=f21e157]
          - paragraph [ref=f21e158]: Señal Pública es un podcast sobre inteligencia artificial aplicada a problemas de política pública, sociedad y economía. Cada episodio toma un caso concreto de Argentina o América Latina y analiza, con fuentes a la vista, qué cambia y qué no cambia con IA.
          - button "Copiar" [ref=f21e159] [cursor=pointer]
          - heading "Descripción en 150 palabras" [level=3] [ref=f21e160]
          - paragraph [ref=f21e161]: "Señal Pública es un podcast sobre inteligencia artificial aplicada a problemas públicos concretos. No es un programa de novedades tecnológicas: cada episodio parte de un problema real —una ley en discusión, un trámite municipal, un mercado de trabajo, un servicio público— y lo somete a prueba. Comparamos lo que hace un sistema de IA con lo que hace una persona experta, contrastamos respuestas de chatbots con normativa oficial y seguimos casos de implementación en el Estado. Todo lo que afirmamos tiene una fuente primaria citada y verificable: boletines oficiales, datasets públicos, papers y documentos de organismos. Está pensado para funcionarios, legisladores y sus equipos, periodistas, investigadores, organizaciones sociales y público informado que quiere entender la IA sin publicidad ni pánico. Publicamos transcripciones completas, capítulos, fuentes y una fe de erratas pública."
          - button "Copiar" [ref=f21e162] [cursor=pointer]
