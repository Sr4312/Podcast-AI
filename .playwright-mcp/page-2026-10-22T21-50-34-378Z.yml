      - generic [ref=f21e54]:
        - heading "Acerca de Señal Pública" [level=1] [ref=f21e55]
        - region [ref=f21e56]:
          - heading "Qué es" [level=2] [ref=f21e57]
          - paragraph [ref=f21e58]: Señal Pública es un podcast sobre inteligencia artificial aplicada a problemas de política pública, sociedad y economía. Cada episodio toma un caso concreto de Argentina o América Latina y analiza, con fuentes a la vista, qué cambia y qué no cambia con IA.
          - paragraph [ref=f21e59]: No es un podcast de novedades tecnológicas. No reseñamos productos ni hablamos del futuro. Cada episodio parte de un problema que ya existe, una ley en discusión, un trámite, un servicio público, y pregunta qué cambia y qué no cambia cuando entra un sistema de inteligencia artificial.
        - region [ref=f21e60]:
          - heading "Quiénes conducen" [level=2] [ref=f21e61]
          - list [ref=f21e62]:
            - listitem [ref=f21e63]:
              - generic [aria-hidden] [ref=f21e64]: LF
              - generic [ref=f21e65]:
                - heading "Lucía Ferreyra" [level=3] [ref=f21e66]
                - paragraph [ref=f21e67]: Politóloga. Conduce Señal Pública.
                - generic [ref=f21e68]:
                  - paragraph [ref=f21e69]: Politóloga por la Universidad de Buenos Aires. Durante diez años fue asesora legislativa y vio de cerca cómo se escriben, se negocian y se archivan los proyectos de ley. Hoy investiga gobierno digital y el uso de sistemas automatizados en el Estado. En Señal Pública se ocupa de que cada afirmación tenga una fuente primaria a la vista.
                  - paragraph [ref=f21e70]:
                    - emphasis [ref=f21e71]: Perfil de ejemplo para la demo. Reemplazar por el real.
                - paragraph [ref=f21e72]: "Conflictos declarados: Trabajó como asesora legislativa en el Senado de la Nación entre 2014 y 2024. No asesora actualmente a ningún bloque."
            - listitem [ref=f21e73]:
              - generic [aria-hidden] [ref=f21e74]: MA
              - generic [ref=f21e75]:
                - heading "Martín Albarracín" [level=3] [ref=f21e76]
                - paragraph [ref=f21e77]: Economista. Conduce Señal Pública.
                - generic [ref=f21e78]:
                  - paragraph [ref=f21e79]: "Economista y docente universitario. Estudia mercados de trabajo, productividad y automatización, con foco en qué dicen los datos y no en qué dicen los pronósticos. Antes de Señal Pública coordinó equipos de análisis de datos en organizaciones de la sociedad civil. En el podcast se ocupa de los números: de dónde salen, qué miden y qué no."
                  - paragraph [ref=f21e80]:
                    - emphasis [ref=f21e81]: Perfil de ejemplo para la demo. Reemplazar por el real.
                - paragraph [ref=f21e82]: Sin conflictos declarados.
        - region [ref=f21e83]:
          - heading "Línea editorial" [level=2] [ref=f21e84]
          - list [ref=f21e85]:
            - listitem [ref=f21e86]:
              - strong [ref=f21e87]: Evidencia primero.
              - text: Una afirmación sin fuente primaria no sale al aire. Si no la encontramos, decimos que no la encontramos.
            - listitem [ref=f21e88]:
              - strong [ref=f21e89]: Un problema por episodio.
              - text: Preferimos un caso concreto, con nombre y fecha, antes que una tendencia.
            - listitem [ref=f21e90]:
              - strong [ref=f21e91]: Qué cambia y qué no.
              - text: Cada episodio termina con esa sección. El "no cambia" suele ser lo más útil.
            - listitem [ref=f21e92]:
              - strong [ref=f21e93]: Sin pánico ni publicidad.
              - text: No usamos la palabra "revolución". No aceptamos episodios pagos ni contenido de proveedores.
            - listitem [ref=f21e94]:
              - strong [ref=f21e95]: Para gente que decide.
              - text: Escribimos para funcionarios, legisladores, periodistas, investigadores y organizaciones, en lenguaje llano.
        - region [ref=f21e96]:
          - heading "Cómo verificamos" [level=2] [ref=f21e97]
          - list [ref=f21e98]:
            - listitem [ref=f21e99]: Antes de grabar, listamos cada dato o afirmación verificable que va a aparecer en el episodio.
            - listitem [ref=f21e100]: "Para cada uno buscamos la fuente primaria: Boletín Oficial, InfoLEG, el organismo que produce el dato, el paper, el dataset. No citamos notas periodísticas como fuente de un dato si existe la fuente original."
            - listitem [ref=f21e101]:
              - text: Una persona del equipo abre el documento y confirma el dato. Recién entonces la fuente se marca como
              - generic [ref=f21e102]: Verificada
              - text: en la página del episodio.
            - listitem [ref=f21e103]:
              - text: Si no pudimos confirmar algo antes de publicar, queda marcado como
              - generic [ref=f21e104]: Pendiente de verificación
              - text: ", a la vista."
            - listitem [ref=f21e105]: Cuando un episodio cita una cifra, la página dice de dónde sale y qué mide. Si la cifra la aportó un invitado y no la auditamos, lo decimos.
          - paragraph [ref=f21e106]:
            - text: La
            - link "biblioteca de fuentes" [ref=f21e107] [cursor=pointer]:
              - /url: /fuentes
            - text: reúne todo lo citado en todos los episodios.
        - region [ref=f21e108]:
          - heading "Cómo usamos IA en la producción" [level=2] [ref=f21e109]
          - paragraph [ref=f21e110]: Usamos sistemas de IA para tareas de forma y los mantenemos fuera de las tareas de hecho. En cada episodio, la sección "Cómo usamos IA en este episodio" lo detalla.
          - heading "Lo que hace la IA" [level=3] [ref=f21e111]
          - list [ref=f21e112]:
            - listitem [ref=f21e113]: Transcripción automática del audio, que después revisa una persona (nombres, cifras y siglas son lo que más falla).
            - listitem [ref=f21e114]: Borrador del resumen y de los capítulos, que corregimos y firmamos.
            - listitem [ref=f21e115]: En los episodios de laboratorio e investigación, los sistemas de IA son el objeto de la prueba.
          - heading "Lo que no hace" [level=3] [ref=f21e116]
          - list [ref=f21e117]:
            - listitem [ref=f21e118]: Elegir fuentes ni verificar citas. Eso lo hace una persona, documento en mano.
            - listitem [ref=f21e119]: Sacar conclusiones ni escribir el guion.
            - listitem [ref=f21e120]: Generar imágenes. La identidad visual del sitio es la waveform real de cada episodio.
            - listitem [ref=f21e121]: Clonar voces ni generar audio.
          - paragraph [ref=f21e122]: Cada resumen lleva al pie quién lo revisó. Si en algún momento cambiamos esta política, lo anunciamos en un episodio y acá.
        - region [ref=f21e123]:
          - heading "Conflictos de interés" [level=2] [ref=f21e124]
          - paragraph [ref=f21e125]: Pedimos a cada persona invitada que declare, antes de grabar, vínculos laborales, económicos o institucionales con el tema del episodio. La declaración se publica en su perfil y en la página del episodio, o se indica "Sin conflictos declarados".
          - paragraph [ref=f21e126]: Los conductores declaran los suyos en esta página y los actualizan cuando cambian. El podcast no recibe dinero de proveedores de tecnología ni de organismos cuyos sistemas analiza. Si eso cambiara, se declararía episodio por episodio.
          - paragraph [ref=f21e127]: "Que alguien tenga un conflicto no lo excluye: lo que importa es que quien escucha lo sepa."
        - region [ref=f21e128]:
          - heading "Cómo pedir una corrección" [level=2] [ref=f21e129]
          - paragraph [ref=f21e130]:
            - text: Si encontrás un error, un dato mal citado, un nombre equivocado, una fuente que no dice lo que decimos que dice, escribinos a
            - link "correcciones@senalpublica.ar" [ref=f21e131] [cursor=pointer]:
              - /url: mailto:correcciones@senalpublica.ar
            - text: con el episodio, el minuto y la fuente que lo contradice.
          - paragraph [ref=f21e132]:
            - text: Las correcciones se publican con fecha en la página del episodio y en la
            - link "fe de erratas pública" [ref=f21e133] [cursor=pointer]:
              - /url: /correcciones
            - text: ". No borramos el error: dejamos constancia de qué decía y qué dice ahora. Si el error está en el audio, lo aclaramos al inicio del episodio siguiente."
        - region [ref=f21e134]:
          - heading "Contacto" [level=2] [ref=f21e135]
