  - main [ref=f18e32]:
    - generic [ref=f18e33]:
      - paragraph [ref=f18e35]: Un recorrido de 3 episodios, en el orden que recomendamos. Cada uno se puede escuchar suelto.
      - generic [ref=f18e36]:
        - heading "Empezá por acá" [level=1] [ref=f18e37]
        - paragraph [ref=f18e38]: "Señal Pública no comenta novedades: toma un problema público concreto y lo pone a prueba. Estos episodios muestran los tres formatos con los que trabajamos y la manera en que citamos cada dato."
        - list [ref=f18e39]:
          - listitem [ref=f18e40]:
            - generic [aria-hidden] [ref=f18e41]: "1"
            - generic [ref=f18e42]:
              - paragraph [ref=f18e43]: Laboratorio · 38 min
              - heading [level=2] [ref=f18e44]:
                - link "¿Puede una IA asesorar a un senador?" [ref=f18e45] [cursor=pointer]:
                  - /url: /episodios/001-puede-una-ia-asesorar-a-un-senador
              - paragraph [ref=f18e46]: Un modelo de lenguaje y una asesora legislativa analizan el mismo proyecto de ley sin verse. Comparamos qué encontró cada uno y qué se le escapó.
              - paragraph [ref=f18e47]:
                - strong [ref=f18e48]: "Por qué empezar por acá:"
                - text: "Ponemos a prueba un sistema de IA contra una persona experta en la misma tarea. Lo que te llevás: el modelo identificó todos los artículos que modifican la Ley 25.326 y resumió correctamente el objeto del proyecto en menos de un minuto."
              - generic [ref=f18e49]:
                - button "Reproducir" [ref=f18e50] [cursor=pointer]
                - link "Leer el resumen" [ref=f18e54] [cursor=pointer]:
                  - /url: /episodios/001-puede-una-ia-asesorar-a-un-senador#resumen
          - listitem [ref=f18e55]:
            - generic [aria-hidden] [ref=f18e56]: "2"
            - generic [ref=f18e57]:
              - paragraph [ref=f18e58]: Caso · 41 min
              - heading [level=2] [ref=f18e59]:
                - link "El chatbot de un municipio, seis meses después" [ref=f18e60] [cursor=pointer]:
                  - /url: /episodios/002-el-chatbot-de-un-municipio
              - paragraph [ref=f18e61]: Un municipio mediano puso un asistente de IA a responder consultas de vecinos. Su secretario de Modernización cuenta qué funcionó, qué salió mal y cuánto costó.
              - paragraph [ref=f18e62]:
                - strong [ref=f18e63]: "Por qué empezar por acá:"
                - text: "Seguimos una implementación real de IA en el Estado o en una organización. Lo que te llevás: el asistente resolvió bien las consultas de horarios, requisitos y estado de trámites, que eran la mayoría, y descomprimió la mesa de entradas."
              - generic [ref=f18e64]:
                - button "Reproducir" [ref=f18e65] [cursor=pointer]
                - link "Leer el resumen" [ref=f18e69] [cursor=pointer]:
                  - /url: /episodios/002-el-chatbot-de-un-municipio#resumen
          - listitem [ref=f18e70]:
            - generic [aria-hidden] [ref=f18e71]: "3"
            - generic [ref=f18e72]:
              - paragraph [ref=f18e73]: Investigación · 47 min
              - heading [level=2] [ref=f18e74]:
                - link "Chatbots contra el Boletín Oficial" [ref=f18e75] [cursor=pointer]:
                  - /url: /episodios/003-chatbots-contra-el-boletin-oficial
              - paragraph [ref=f18e76]: Le hicimos sesenta preguntas sobre normativa argentina a cuatro chatbots y contrastamos cada respuesta con la fuente oficial. Acertaron mucho, inventaron en lo que más importa.
              - paragraph [ref=f18e77]:
                - strong [ref=f18e78]: "Por qué empezar por acá:"
                - text: "Contrastamos sistemáticamente respuestas de IA con fuentes oficiales. Lo que te llevás: en preguntas sobre el contenido de leyes conocidas y estables, como el Código Civil y Comercial, los cuatro sistemas respondieron bien en la gran mayoría de los casos."
              - generic [ref=f18e79]:
                - button "Reproducir" [ref=f18e80] [cursor=pointer]
                - link "Leer el resumen" [ref=f18e84] [cursor=pointer]:
                  - /url: /episodios/003-chatbots-contra-el-boletin-oficial#resumen
        - region [ref=f18e85]:
          - heading "Después de estos" [level=2] [ref=f18e86]
          - list [ref=f18e87]:
            - listitem [ref=f18e88]:
              - link "El archivo completo" [ref=f18e89] [cursor=pointer]:
                - /url: /episodios
              - text: ", con filtros por eje, formato y tema, y búsqueda dentro de las transcripciones."
            - listitem [ref=f18e90]:
              - link "El glosario" [ref=f18e91] [cursor=pointer]:
