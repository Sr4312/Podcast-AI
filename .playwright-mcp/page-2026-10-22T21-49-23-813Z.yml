  - main [ref=f15e32]:
    - generic [ref=f15e33]:
      - paragraph [ref=f15e35]: Tres ejes, 10 temas. Cada tema tiene su página con episodios y términos del glosario relacionados.
      - generic [ref=f15e36]:
        - heading "Temas" [level=1] [ref=f15e37]
        - region [ref=f15e38]:
          - heading "Política pública" [level=2] [ref=f15e39]
          - paragraph [ref=f15e40]: "Leyes, regulación, trámites y decisiones del Estado: dónde la IA entra en el circuito y qué cambia en el resultado."
          - paragraph [ref=f15e41]: 3 episodios
          - list [ref=f15e42]:
            - listitem [ref=f15e43]:
              - generic [ref=f15e44]:
                - link "Legislación" [ref=f15e45] [cursor=pointer]:
                  - /url: /temas/legislacion
                - paragraph [ref=f15e46]: "Proyectos de ley, dictámenes y normas en discusión: qué pasa cuando un sistema de IA entra en el circuito de redactar, analizar o votar."
              - generic [ref=f15e47]: 2 eps.
            - listitem [ref=f15e48]:
              - generic [ref=f15e49]:
                - link "Asesoramiento legislativo" [ref=f15e50] [cursor=pointer]:
                  - /url: /temas/asesoramiento-legislativo
                - paragraph [ref=f15e51]: "El trabajo de los equipos que leen, resumen y negocian proyectos: cuánto de eso puede hacer un modelo de lenguaje y cuánto depende de saber quién pidió qué."
              - generic [ref=f15e52]: 1 ep.
            - listitem [ref=f15e53]:
              - generic [ref=f15e54]:
                - link "Gobierno digital" [ref=f15e55] [cursor=pointer]:
                  - /url: /temas/gobierno-digital
                - paragraph [ref=f15e56]: "Trámites, expedientes y sistemas del Estado: dónde la automatización ahorra tiempo de verdad y dónde solo mueve la cola de lugar."
              - generic [ref=f15e57]: 1 ep.
            - listitem [ref=f15e58]:
              - generic [ref=f15e59]:
                - link "Municipios" [ref=f15e60] [cursor=pointer]:
                  - /url: /temas/municipios
                - paragraph [ref=f15e61]: "Gobiernos locales con presupuesto chico y demanda grande: cómo compran tecnología, qué contratan y quién responde cuando falla."
              - generic [ref=f15e62]: 1 ep.
        - region [ref=f15e63]:
          - heading "Sociedad" [level=2] [ref=f15e64]
          - paragraph [ref=f15e65]: Derechos, información pública, educación, salud y la relación cotidiana entre personas e instituciones.
          - paragraph [ref=f15e66]: 1 episodio
          - list [ref=f15e67]:
            - listitem [ref=f15e68]:
              - generic [ref=f15e69]:
                - link "Datos personales" [ref=f15e70] [cursor=pointer]:
                  - /url: /temas/datos-personales
                - paragraph [ref=f15e71]: Qué datos de las personas entran a un sistema de IA, con qué base legal, quién los guarda y durante cuánto tiempo. La Ley 25.326 como punto de partida.
              - generic [ref=f15e72]: 2 eps.
            - listitem [ref=f15e73]:
              - generic [ref=f15e74]:
                - link "Atención ciudadana" [ref=f15e75] [cursor=pointer]:
                  - /url: /temas/atencion-ciudadana
                - paragraph [ref=f15e76]: "Mesas de entrada, líneas telefónicas y chats de consulta: qué le pasa a la persona del otro lado cuando quien responde es un sistema automatizado."
              - generic [ref=f15e77]: 1 ep.
            - listitem [ref=f15e78]:
              - generic [ref=f15e79]:
                - link "Chatbots" [ref=f15e80] [cursor=pointer]:
                  - /url: /temas/chatbots
                - paragraph [ref=f15e81]: "Sistemas conversacionales que responden preguntas del público: qué tan bien lo hacen cuando la pregunta es sobre una norma, un plazo o un derecho."
              - generic [ref=f15e82]: 1 ep.
            - listitem [ref=f15e83]:
              - generic [ref=f15e84]:
                - link "Información pública" [ref=f15e85] [cursor=pointer]:
                  - /url: /temas/informacion-publica
                - paragraph [ref=f15e86]: "El derecho a saber qué hace el Estado: cómo cambia el acceso a la información cuando las respuestas las da un sistema y no una oficina."
              - generic [ref=f15e87]: 1 ep.
        - region [ref=f15e88]:
          - heading "Economía" [level=2] [ref=f15e89]
          - paragraph [ref=f15e90]: "Trabajo, productividad, mercados y costos: qué dicen los datos sobre el impacto real de la automatización."
          - paragraph [ref=f15e91]: 1 episodio
          - list [ref=f15e92]:
            - listitem [ref=f15e93]:
              - generic [ref=f15e94]:
                - link "Costos del Estado" [ref=f15e95] [cursor=pointer]:
                  - /url: /temas/costos-del-estado
                - paragraph [ref=f15e96]: Cuánto cuesta un sistema de IA en el sector público, contra qué se compara ese costo y qué pasa con el gasto cuando el contrato termina.
              - generic [ref=f15e97]: 1 ep.
            - listitem [ref=f15e98]:
              - generic [ref=f15e99]:
                - link "Trabajo y automatización" [ref=f15e100] [cursor=pointer]:
                  - /url: /temas/trabajo-y-automatizacion
                - paragraph [ref=f15e101]: Qué tareas concretas cambian cuando llega un sistema de IA a una oficina, qué empleos se reorganizan y qué dicen los datos, no los pronósticos.
              - generic [ref=f15e102]: 0 eps.
