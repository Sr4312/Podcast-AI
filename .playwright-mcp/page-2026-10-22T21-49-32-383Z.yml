        - heading "Chatbots" [level=1] [ref=f16e46]
        - paragraph [ref=f16e47]: "Sistemas conversacionales que responden preguntas del público: qué tan bien lo hacen cuando la pregunta es sobre una norma, un plazo o un derecho."
        - region [ref=f16e48]:
          - heading "Episodios" [level=2] [ref=f16e49]
          - list [ref=f16e50]:
            - listitem [ref=f16e51]:
              - generic [ref=f16e52]: "03"
              - generic [ref=f16e53]:
                - link "Chatbots contra el Boletín Oficial" [ref=f16e54] [cursor=pointer]:
                  - /url: /episodios/003-chatbots-contra-el-boletin-oficial
                - paragraph [ref=f16e55]: Le hicimos sesenta preguntas sobre normativa argentina a cuatro chatbots y contrastamos cada respuesta con la fuente oficial. Acertaron mucho, inventaron en lo que más importa.
                - paragraph [ref=f16e56]:
                  - time [ref=f16e57]: 01 de oct de 2026
                  - text: · Investigación · 47 min · con Ana Paula Sosa y Julián Ortiz · ejemplo
              - 'button "Reproducir episodio 3: Chatbots contra el Boletín Oficial" [ref=f16e58] [cursor=pointer]'
        - region [ref=f16e61]:
          - heading "Términos relacionados" [level=2] [ref=f16e62]
          - generic [ref=f16e63]:
            - generic [ref=f16e64]:
              - term [ref=f16e65]:
                - link "Chatbot" [ref=f16e66] [cursor=pointer]:
                  - /url: /glosario/chatbot
              - definition [ref=f16e67]: Programa que conversa por texto o voz. Los de la generación anterior seguían guiones fijos; los actuales usan modelos de lenguaje y responden cualquier cosa, lo que los hace más útiles y más propensos a inventar.
            - generic [ref=f16e68]:
              - term [ref=f16e69]:
                - link "Modelo de lenguaje" [ref=f16e70] [cursor=pointer]:
                  - /url: /glosario/modelo-de-lenguaje
              - definition [ref=f16e71]: Programa entrenado con enormes cantidades de texto para predecir qué palabra sigue. Con eso redacta, resume y responde preguntas con fluidez, pero no verifica si lo que dice es cierto.
            - generic [ref=f16e72]:
              - term [ref=f16e73]:
                - link "Alucinación" [ref=f16e74] [cursor=pointer]:
                  - /url: /glosario/alucinacion
              - definition [ref=f16e75]: "Respuesta de un sistema de IA que suena correcta y segura pero es falsa: una ley que no existe, un artículo con otro número, una cifra inventada. No es un error raro, es parte de cómo funcionan estos modelos."
            - generic [ref=f16e76]:
              - term [ref=f16e77]:
                - link "Recuperación aumentada" [ref=f16e78] [cursor=pointer]:
                  - /url: /glosario/recuperacion-aumentada
              - definition [ref=f16e79]: Técnica en la que, antes de responder, el sistema busca los documentos relevantes (una ley, un manual, un expediente) y se los pasa al modelo para que responda a partir de ellos y no de memoria.
