              - text: ·
              - link "Apple Podcasts" [ref=f11e231] [cursor=pointer]:
                - /url: https://podcasts.apple.com/ar/podcast/ejemplo-senal-publica
        - region [ref=f11e232]:
          - heading "En 2 minutos" [level=2] [ref=f11e233]
          - list [ref=f11e234]:
            - listitem [ref=f11e235]: El asistente resolvió bien las consultas de horarios, requisitos y estado de trámites, que eran la mayoría, y descomprimió la mesa de entradas.
            - listitem [ref=f11e236]: "Falló en lo que tenía excepciones: plazos que dependen del caso, tasas con descuentos y normativa local reciente que no estaba en los documentos cargados."
            - listitem [ref=f11e237]: El contrato se pagó por consulta procesada, y el costo mensual terminó siendo mayor que el estimado porque nadie había medido cuántas consultas había antes.
            - listitem [ref=f11e238]: El municipio no tenía definido qué pasa con los datos de las conversaciones ni quién responde cuando el asistente da una respuesta errónea.
            - listitem [ref=f11e239]: El cambio más valioso no fue el chatbot sino el inventario de trámites y respuestas que hubo que escribir para alimentarlo.
          - paragraph [ref=f11e240]: "Este episodio sigue un caso de implementación en un municipio de tamaño medio, con un equipo de modernización de tres personas y una mesa de entradas que atendía consultas presenciales, telefónicas y por redes sin ningún registro unificado. En 2025 el municipio contrató a un proveedor para poner en marcha un asistente conversacional basado en un modelo de lenguaje, alimentado con los documentos de trámites del propio municipio. Seis meses después, hablamos con Diego Lamarque, el funcionario que lideró el proyecto, que aceptó discutir en público tanto los resultados como los errores. Recorremos el caso en orden: qué problema querían resolver, qué compraron y cómo se pagó, qué pasó en las primeras semanas, dónde falló, qué se hizo con los datos de las personas y qué le diría a otro intendente que esté por firmar un contrato parecido. El municipio, el funcionario y las cifras de este episodio son ficticios, creados para la demo del sitio."
          - paragraph [ref=f11e241]: Resumen redactado con asistencia de IA y revisado por Martín Albarracín.
        - figure "Diego Lamarque, 00:36:48" [ref=f11e242]:
          - blockquote [ref=f11e243]:
            - paragraph [ref=f11e244]: Lo que más sirvió no fue el bot. Fue que por primera vez tuvimos que escribir en un documento cómo se hace cada trámite. Eso no lo teníamos.
