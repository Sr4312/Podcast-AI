        - generic [ref=f11e57]:
          - paragraph [ref=f11e58]: Temporada 1 · Episodio 2
          - heading "El chatbot de un municipio, seis meses después" [level=1] [ref=f11e59]
          - paragraph [ref=f11e60]: Un municipio mediano puso un asistente de IA a responder consultas de vecinos. Su secretario de Modernización cuenta qué funcionó, qué salió mal y cuánto costó.
          - generic [ref=f11e223]:
            - button "Reproducir desde 12:34" [ref=f11e224] [cursor=pointer]
            - paragraph [ref=f11e228]:
              - text: Escuchalo en
              - link "YouTube" [ref=f11e229] [cursor=pointer]:
