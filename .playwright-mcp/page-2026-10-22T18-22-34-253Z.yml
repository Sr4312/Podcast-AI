      - article [ref=f9e56]:
        - generic [ref=f9e57]:
          - paragraph [ref=f9e58]: Temporada 1 · Episodio 1
          - heading "¿Puede una IA asesorar a un senador?" [level=1] [ref=f9e59]
          - paragraph [ref=f9e60]: Un modelo de lenguaje y una asesora legislativa analizan el mismo proyecto de ley sin verse. Comparamos qué encontró cada uno y qué se le escapó.
          - generic [ref=f9e223]:
            - button "Reproducir" [ref=f9e224] [cursor=pointer]
