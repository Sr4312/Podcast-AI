              - text: Escuchalo en
              - link "YouTube" [ref=f9e229] [cursor=pointer]:
                - /url: https://www.youtube.com/@senalpublica
              - text: ·
              - link "Spotify" [ref=f9e230] [cursor=pointer]:
                - /url: https://open.spotify.com/show/ejemplo-senal-publica
              - text: ·
              - link "Apple Podcasts" [ref=f9e231] [cursor=pointer]:
                - /url: https://podcasts.apple.com/ar/podcast/ejemplo-senal-publica
        - region [ref=f9e232]:
          - heading "En 2 minutos" [level=2] [ref=f9e233]
          - list [ref=f9e234]:
            - listitem [ref=f9e235]: El modelo identificó todos los artículos que modifican la Ley 25.326 y resumió correctamente el objeto del proyecto en menos de un minuto.
            - listitem [ref=f9e236]: "La asesora detectó dos cosas que el modelo no vio: una remisión a un decreto derogado y el conflicto de un artículo con la Ley 27.275."
            - listitem [ref=f9e237]: El modelo propuso tres riesgos regulatorios plausibles, pero uno de ellos citaba una norma inexistente con número y fecha.
            - listitem [ref=f9e238]: "La diferencia no estuvo en la lectura sino en el contexto político: quién pidió cada artículo y qué negociación lo explica."
            - listitem [ref=f9e239]: "Conclusión provisoria: sirve como primera lectura y como control de consistencia, no como dictamen ni como fuente de citas."
          - paragraph [ref=f9e240]: "Elegimos un proyecto de ley real que modifica el régimen de protección de datos personales, de los que se presentan cada año en el Senado y rara vez llegan al recinto. Le dimos el texto completo, con fundamentos, a un modelo de lenguaje de uso general con una consigna idéntica a la que recibe un asesor nuevo en una comisión: objeto, artículos clave, normas que toca, riesgos y preguntas para el autor. En paralelo, Carolina Bustos, asesora con quince años en el Senado, hizo el mismo trabajo sin ver la respuesta del modelo. Después pusimos los dos análisis uno al lado del otro y los recorrimos punto por punto en el estudio. Lo que encontramos no es que uno gane y otro pierda, sino que miden cosas distintas: el modelo es exhaustivo con el texto y ciego al proceso; la asesora es selectiva con el texto y precisa con el proceso. Las cifras, el proyecto y los nombres de este episodio son de ejemplo para la demo del sitio."
          - paragraph [ref=f9e241]: Resumen redactado con asistencia de IA y revisado por Lucía Ferreyra.
        - figure "Carolina Bustos, 00:29:12" [ref=f9e242]:
          - blockquote [ref=f9e243]:
            - paragraph [ref=f9e244]: "El modelo encontró todos los artículos. Lo que no encontró fue el pasillo: quién pidió ese artículo y a cambio de qué."
