      - article [ref=f26e53]:
        - generic [ref=f26e54]:
          - paragraph [ref=f26e55]: Temporada 1 · Episodio 3
          - heading "Chatbots contra el Boletín Oficial" [level=1] [ref=f26e56]
          - paragraph [ref=f26e57]: Le hicimos sesenta preguntas sobre normativa argentina a cuatro chatbots y contrastamos cada respuesta con la fuente oficial. Acertaron mucho, inventaron en lo que más importa.
          - generic [ref=f26e132]:
            - button "Reproducir" [ref=f26e133] [cursor=pointer]
