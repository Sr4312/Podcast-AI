            - button "Saltar a 00:00:00" [ref=f26e317] [cursor=pointer]: 00:00:00
            - button "Copiar link a este momento" [ref=f26e318] [cursor=pointer]
            - strong [ref=f26e322]: "Lucía Ferreyra:"
            - text: Hola, esto es Señal Pública. Soy Lucía Ferreyra.
          - paragraph [ref=f26e323]:
            - button "Saltar a 00:00:07" [ref=f26e324] [cursor=pointer]: 00:00:07
            - button "Copiar link a este momento" [ref=f26e325] [cursor=pointer]
            - strong [ref=f26e329]: "Martín Albarracín:"
            - text: "Y yo soy Martín Albarracín. Tercer episodio y tercer formato: hoy es una investigación. Armamos una prueba, la corrimos, y vamos a contar los resultados con todos los datos publicados."
          - paragraph [ref=f26e330]:
            - button "Saltar a 00:00:28" [ref=f26e331] [cursor=pointer]: 00:00:28
            - button "Copiar link a este momento" [ref=f26e332] [cursor=pointer]
            - strong [ref=f26e336]: "Lucía Ferreyra:"
            - text: "La pregunta es simple y la escuchamos todo el tiempo: si le pregunto a un"
            - link "chatbot" [ref=f26e337] [cursor=pointer]:
              - /url: /glosario/chatbot
            - text: sobre una ley argentina, ¿me responde bien? Hay mucha opinión sobre eso y pocos datos locales. Así que fuimos a buscar los datos.
          - paragraph [ref=f26e338]:
            - button "Saltar a 00:00:50" [ref=f26e339] [cursor=pointer]: 00:00:50
            - button "Copiar link a este momento" [ref=f26e340] [cursor=pointer]
            - strong [ref=f26e344]: "Martín Albarracín:"
            - text: Para hacerlo bien necesitábamos dos personas que no somos nosotros. Una abogada que escribiera preguntas con respuesta verificable y evaluara las respuestas. Y alguien que supiera hacerle las mismas preguntas a varios sistemas de forma comparable, sin contaminar la prueba.
          - paragraph [ref=f26e345]:
            - button "Saltar a 00:01:14" [ref=f26e346] [cursor=pointer]: 00:01:14
            - button "Copiar link a este momento" [ref=f26e347] [cursor=pointer]
            - strong [ref=f26e351]: "Lucía Ferreyra:"
            - text: Están las dos acá. Ana Paula Sosa, doctora en Derecho, investiga procedimiento administrativo y acceso a la información. Y Julián Ortiz, ingeniero de datos, que arma y evalúa sistemas con
            - link "modelos de lenguaje" [ref=f26e352] [cursor=pointer]:
              - /url: /glosario/modelo-de-lenguaje
            - text: . Bienvenidos.
          - paragraph [ref=f26e353]:
            - button "Saltar a 00:01:33" [ref=f26e354] [cursor=pointer]: 00:01:33
            - button "Copiar link a este momento" [ref=f26e355] [cursor=pointer]
            - strong [ref=f26e359]: "Ana Paula Sosa:"
            - text: Gracias. Aclaro desde el principio que yo llegué a esto escéptica, y me fui más escéptica en algunas cosas y menos en otras.
          - paragraph [ref=f26e360]:
            - button "Saltar a 00:01:45" [ref=f26e361] [cursor=pointer]: 00:01:45
            - button "Copiar link a este momento" [ref=f26e362] [cursor=pointer]
            - strong [ref=f26e366]: "Julián Ortiz:"
            - text: Y yo llegué del otro lado. Trabajo con estos sistemas todos los días y los defiendo bastante. También me fui con matices.
          - paragraph [ref=f26e367]:
            - button "Saltar a 00:01:56" [ref=f26e368] [cursor=pointer]: 00:01:56
            - button "Copiar link a este momento" [ref=f26e369] [cursor=pointer]
            - strong [ref=f26e373]: "Martín Albarracín:"
            - text: "Conflictos de interés, que están en la página: Julián trabajó como consultor para un proveedor de chatbots hasta 2023 y no tiene relación actual con los sistemas evaluados. Ana Paula no declara conflictos."
          - paragraph [ref=f26e374]:
            - button "Saltar a 00:02:14" [ref=f26e375] [cursor=pointer]: 00:02:14
            - button "Copiar link a este momento" [ref=f26e376] [cursor=pointer]
            - strong [ref=f26e380]: "Lucía Ferreyra:"
            - text: "Y una aclaración que vamos a repetir varias veces: esto no es un ranking de productos. No vamos a decir qué chatbot es mejor. Son cuatro sistemas de uso general, los llamamos A, B, C y D, y lo que nos importa es qué tipo de pregunta responden bien y cuál mal, porque eso es lo que le sirve a un organismo que está decidiendo si usa uno."
          - paragraph [ref=f26e381]:
            - button "Saltar a 00:02:42" [ref=f26e382] [cursor=pointer]: 00:02:42
            - button "Copiar link a este momento" [ref=f26e383] [cursor=pointer]
            - strong [ref=f26e387]: "Julián Ortiz:"
            - text: "Agrego una razón técnica para no dar nombres: estos sistemas cambian cada pocas semanas. Lo que medimos es una foto de una semana de agosto. El ranking de hoy no sirve en octubre. El tipo de error, sí."
          - paragraph [ref=f26e388]:
            - button "Saltar a 00:03:02" [ref=f26e389] [cursor=pointer]: 00:03:02
            - button "Copiar link a este momento" [ref=f26e390] [cursor=pointer]
            - strong [ref=f26e394]: "Martín Albarracín:"
            - text: "Todo lo que vamos a contar está publicado: las sesenta preguntas, la respuesta correcta de cada una con su link a la fuente oficial, las respuestas de los cuatro sistemas sin editar, y la planilla de evaluación de Ana Paula. Si alguien quiere repetir la prueba o discutir una evaluación, tiene todo."
          - paragraph [ref=f26e395]:
            - button "Saltar a 00:03:25" [ref=f26e396] [cursor=pointer]: 00:03:25
            - button "Copiar link a este momento" [ref=f26e397] [cursor=pointer]
            - strong [ref=f26e401]: "Lucía Ferreyra:"
            - text: Empecemos por el diseño, porque ahí está la mitad del valor de esto.
          - heading "Cómo armamos la prueba" [level=2] [ref=f26e402]
          - paragraph [ref=f26e403]:
            - button "Saltar a 00:03:40" [ref=f26e404] [cursor=pointer]: 00:03:40
            - button "Copiar link a este momento" [ref=f26e405] [cursor=pointer]
            - strong [ref=f26e409]: "Ana Paula Sosa:"
            - text: "La primera decisión fue qué tipo de preguntas. Yo propuse tres grupos, porque en mi experiencia son tres cosas distintas. Primero, el contenido de normas estables: qué dice el Código Civil y Comercial sobre prescripción, qué es la capacidad restringida, cosas que están igual hace diez años y están en todos lados."
          - paragraph [ref=f26e410]:
