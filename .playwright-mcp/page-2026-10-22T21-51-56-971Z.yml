                - generic [ref=f26e161]: Apple Podcasts
        - region [ref=f26e162]:
          - heading "En 2 minutos" [level=2] [ref=f26e163]
          - list [ref=f26e164]:
            - listitem [ref=f26e165]: En preguntas sobre el contenido de leyes conocidas y estables, como el Código Civil y Comercial, los cuatro sistemas respondieron bien en la gran mayoría de los casos.
            - listitem [ref=f26e166]: En preguntas sobre plazos, montos actualizados y normas de los últimos dos años, las respuestas incorrectas fueron frecuentes y siempre se dieron sin ninguna señal de duda.
            - listitem [ref=f26e167]: "Las citas fueron el punto más débil: números de artículo cambiados, decretos inexistentes y resoluciones atribuidas al organismo equivocado."
            - listitem [ref=f26e168]: Cuando se les pidió la fuente, los sistemas produjeron links que no existían o que apuntaban a otra norma, con el mismo formato que los links reales.
            - listitem [ref=f26e169]: "La prueba es chica y no es un ranking de productos: es una medida de qué tipo de pregunta se puede delegar y cuál no."
          - paragraph [ref=f26e170]: "Diseñamos una prueba modesta pero sistemática: sesenta preguntas sobre normativa argentina, escritas por una abogada especialista en derecho administrativo, cada una con su respuesta correcta documentada en la fuente oficial (InfoLEG, Boletín Oficial, sitios de organismos). Las preguntas se agruparon en tres tipos: contenido de normas estables, datos que cambian (plazos, montos, autoridades) y citas precisas (número de artículo, norma, organismo). Se las hicimos de forma idéntica a cuatro chatbots de uso general, en la misma semana, con la conversación en blanco, y un ingeniero de datos registró las respuestas sin editarlas. Después, la abogada evaluó cada respuesta como correcta, incorrecta o incompleta, sin saber de qué sistema venía. En el episodio contamos cómo armamos la prueba, qué resultados obtuvimos por tipo de pregunta, por qué pasa lo que pasa y qué puede hacer un organismo que está pensando en poner un sistema de estos a responder al público. Las preguntas, las respuestas y la planilla de evaluación están publicadas. La prueba, las cifras y los invitados de este episodio son de ejemplo para la demo del sitio."
          - paragraph [ref=f26e171]: Resumen redactado con asistencia de IA y revisado por Lucía Ferreyra.
        - figure [ref=f26e172]:
          - blockquote [ref=f26e173]:
            - paragraph [ref=f26e174]: El problema no es que se equivoquen. Es que se equivocan con la misma cara con la que aciertan.
