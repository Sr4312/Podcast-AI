            - button "Saltar a 00:04:11" [ref=f26e418] [cursor=pointer]: 00:04:11
            - button "Copiar link a este momento" [ref=f26e419] [cursor=pointer]
            - strong [ref=f26e423]: "Ana Paula Sosa:"
            - text: Datos que cambian. Plazos que se modificaron, montos que se actualizan, qué organismo es la autoridad de aplicación hoy. Acá la respuesta correcta de hace dos años puede ser incorrecta ahora.
          - paragraph [ref=f26e424]:
            - button "Saltar a 00:04:28" [ref=f26e425] [cursor=pointer]: 00:04:28
            - button "Copiar link a este momento" [ref=f26e426] [cursor=pointer]
            - strong [ref=f26e430]: "Lucía Ferreyra:"
            - text: Y tercero.
          - paragraph [ref=f26e431]:
            - button "Saltar a 00:04:30" [ref=f26e432] [cursor=pointer]: 00:04:30
            - button "Copiar link a este momento" [ref=f26e433] [cursor=pointer]
            - strong [ref=f26e437]: "Ana Paula Sosa:"
            - text: Citas precisas. No "qué dice la ley" sino "en qué artículo lo dice", "qué decreto lo reglamenta", "de qué organismo es la resolución". Es lo que un abogado necesita para escribir y lo que un funcionario necesita para fundar un acto.
          - paragraph [ref=f26e438]:
            - button "Saltar a 00:04:50" [ref=f26e439] [cursor=pointer]: 00:04:50
            - button "Copiar link a este momento" [ref=f26e440] [cursor=pointer]
            - strong [ref=f26e444]: "Julián Ortiz:"
            - text: Esa división me pareció muy buena desde lo técnico, porque corresponde a tres mecanismos distintos de cómo fallan estos modelos. Lo estable está muy repetido en los
            - link "datos de entrenamiento" [ref=f26e445] [cursor=pointer]:
              - /url: /glosario/entrenamiento
            - text: y lo saben. Lo que cambia depende de la fecha de corte. Y las citas precisas son el caso donde el modelo tiene que producir un dato exacto, número de artículo, y ahí es donde más completa por probabilidad.
          - paragraph [ref=f26e446]:
            - button "Saltar a 00:05:22" [ref=f26e447] [cursor=pointer]: 00:05:22
            - button "Copiar link a este momento" [ref=f26e448] [cursor=pointer]
            - strong [ref=f26e452]: "Martín Albarracín:"
            - text: Veinte preguntas por grupo, sesenta en total. ¿Por qué sesenta y no seiscientas?
          - paragraph [ref=f26e453]:
            - button "Saltar a 00:05:30" [ref=f26e454] [cursor=pointer]: 00:05:30
            - button "Copiar link a este momento" [ref=f26e455] [cursor=pointer]
            - strong [ref=f26e459]: "Ana Paula Sosa:"
            - text: "Porque cada pregunta me llevó entre media hora y una hora: escribirla sin ambigüedad, buscar la respuesta en la fuente oficial, documentar el link exacto y escribir el criterio de evaluación antes de ver ninguna respuesta. Sesenta son unas cuarenta horas de trabajo. Es una prueba chica y lo decimos. Pero cada pregunta está bien hecha."
          - paragraph [ref=f26e460]:
            - button "Saltar a 00:05:58" [ref=f26e461] [cursor=pointer]: 00:05:58
            - button "Copiar link a este momento" [ref=f26e462] [cursor=pointer]
            - strong [ref=f26e466]: "Lucía Ferreyra:"
            - text: Eso de escribir el criterio antes de ver las respuestas me parece clave.
          - paragraph [ref=f26e467]:
            - button "Saltar a 00:06:05" [ref=f26e468] [cursor=pointer]: 00:06:05
            - button "Copiar link a este momento" [ref=f26e469] [cursor=pointer]
            - strong [ref=f26e473]: "Ana Paula Sosa:"
            - text: Es lo que evita que yo evalúe con simpatía o antipatía. Para cada pregunta escribí qué tenía que tener una respuesta para ser correcta, qué la hacía incompleta y qué la hacía incorrecta. Después evalué sin saber de qué sistema venía cada respuesta.
          - paragraph [ref=f26e474]:
            - button "Saltar a 00:06:27" [ref=f26e475] [cursor=pointer]: 00:06:27
            - button "Copiar link a este momento" [ref=f26e476] [cursor=pointer]
            - strong [ref=f26e480]: "Martín Albarracín:"
            - text: Julián, cómo se hicieron las preguntas a los sistemas.
          - paragraph [ref=f26e481]:
            - button "Saltar a 00:06:32" [ref=f26e482] [cursor=pointer]: 00:06:32
            - button "Copiar link a este momento" [ref=f26e483] [cursor=pointer]
            - strong [ref=f26e487]: "Julián Ortiz:"
            - text: Cuatro reglas. Misma semana para los cuatro, para que la foto sea comparable. Conversación nueva para cada pregunta, sin historial, porque el historial cambia las respuestas. El texto exacto de la pregunta, sin agregar instrucciones del tipo "sos un abogado experto", porque queríamos medir lo que recibe una persona común. Y sin navegación web activada, en los sistemas donde eso se puede apagar.
          - paragraph [ref=f26e488]:
            - button "Saltar a 00:07:05" [ref=f26e489] [cursor=pointer]: 00:07:05
            - button "Copiar link a este momento" [ref=f26e490] [cursor=pointer]
            - strong [ref=f26e494]: "Lucía Ferreyra:"
            - text: Esa última es discutible. Alguien podría decir que con navegación responderían mejor.
          - paragraph [ref=f26e495]:
            - button "Saltar a 00:07:12" [ref=f26e496] [cursor=pointer]: 00:07:12
            - button "Copiar link a este momento" [ref=f26e497] [cursor=pointer]
            - strong [ref=f26e501]: "Julián Ortiz:"
            - text: Es cierto, y es una limitación que declaramos. La decisión fue medir el modelo, no el buscador. Con navegación, estás midiendo también qué tan bien busca en InfoLEG, que es otra pregunta, interesante, para otra prueba. Y en dos de los cuatro sistemas no se podía apagar, así que lo registramos pregunta por pregunta.
          - paragraph [ref=f26e502]:
            - button "Saltar a 00:07:40" [ref=f26e503] [cursor=pointer]: 00:07:40
            - button "Copiar link a este momento" [ref=f26e504] [cursor=pointer]
            - strong [ref=f26e508]: "Martín Albarracín:"
            - text: ¿Qué registraron de cada respuesta?
          - paragraph [ref=f26e509]:
            - button "Saltar a 00:07:44" [ref=f26e510] [cursor=pointer]: 00:07:44
            - button "Copiar link a este momento" [ref=f26e511] [cursor=pointer]
            - strong [ref=f26e515]: "Julián Ortiz:"
            - text: "El texto completo, la fecha y hora, el sistema, si tenía navegación activa, y si la respuesta incluía alguna señal de incertidumbre: frases como \"creo que\", \"deberías verificar\", \"no estoy seguro\". Esa última columna fue idea de Ana Paula y terminó siendo de las más importantes."
          - paragraph [ref=f26e516]:
            - button "Saltar a 00:08:08" [ref=f26e517] [cursor=pointer]: 00:08:08
            - button "Copiar link a este momento" [ref=f26e518] [cursor=pointer]
            - strong [ref=f26e522]: "Ana Paula Sosa:"
            - text: Porque mi hipótesis era que el problema no es que se equivoquen, es que no avisan. Quería medirlo.
          - paragraph [ref=f26e523]:
            - button "Saltar a 00:08:18" [ref=f26e524] [cursor=pointer]: 00:08:18
            - button "Copiar link a este momento" [ref=f26e525] [cursor=pointer]
            - strong [ref=f26e529]: "Lucía Ferreyra:"
            - text: "Un detalle más de diseño: después de cada pregunta, hicieron una segunda."
          - paragraph [ref=f26e530]:
            - button "Saltar a 00:08:25" [ref=f26e531] [cursor=pointer]: 00:08:25
            - button "Copiar link a este momento" [ref=f26e532] [cursor=pointer]
            - strong [ref=f26e536]: "Julián Ortiz:"
            - text: "Sí. A cada respuesta le pedimos: \"¿me pasás el link a la fuente oficial?\". Queríamos ver qué pasaba cuando se les pedía la fuente. Eso generó un conjunto de datos aparte, de links, que verificamos uno por uno."
          - paragraph [ref=f26e537]:
            - button "Saltar a 00:08:45" [ref=f26e538] [cursor=pointer]: 00:08:45
            - button "Copiar link a este momento" [ref=f26e539] [cursor=pointer]
            - strong [ref=f26e543]: "Martín Albarracín:"
            - text: Adelanto que ese conjunto es el más preocupante del episodio.
          - paragraph [ref=f26e544]:
            - button "Saltar a 00:08:51" [ref=f26e545] [cursor=pointer]: 00:08:51
            - button "Copiar link a este momento" [ref=f26e546] [cursor=pointer]
            - strong [ref=f26e550]: "Ana Paula Sosa:"
            - text: Y el más fácil de verificar, porque un link existe o no existe.
          - paragraph [ref=f26e551]:
            - button "Saltar a 00:09:00" [ref=f26e552] [cursor=pointer]: 00:09:00
            - button "Copiar link a este momento" [ref=f26e553] [cursor=pointer]
            - strong [ref=f26e557]: "Lucía Ferreyra:"
            - text: "Última cosa del método: los"
            - link "sesgos" [ref=f26e558] [cursor=pointer]:
              - /url: /glosario/sesgo-algoritmico
            - text: de la prueba, dichos por ustedes.
          - paragraph [ref=f26e559]:
            - button "Saltar a 00:09:07" [ref=f26e560] [cursor=pointer]: 00:09:07
            - button "Copiar link a este momento" [ref=f26e561] [cursor=pointer]
            - strong [ref=f26e565]: "Ana Paula Sosa:"
            - text: Las preguntas las escribí yo, con mi especialidad, que es derecho administrativo. Hay mucho de procedimiento y de acceso a la información y poco de penal o laboral. Otra persona hubiera elegido otras.
          - paragraph [ref=f26e566]:
            - button "Saltar a 00:09:24" [ref=f26e567] [cursor=pointer]: 00:09:24
            - button "Copiar link a este momento" [ref=f26e568] [cursor=pointer]
            - strong [ref=f26e572]: "Julián Ortiz:"
            - text: Y cuatro sistemas es poco. Hay modelos especializados en derecho, de pago, que no probamos. Medimos lo que usa la gente común, no lo mejor que existe.
          - paragraph [ref=f26e573]:
            - button "Saltar a 00:09:38" [ref=f26e574] [cursor=pointer]: 00:09:38
            - button "Copiar link a este momento" [ref=f26e575] [cursor=pointer]
            - strong [ref=f26e579]: "Martín Albarracín:"
            - text: Con eso dicho, vamos a las preguntas.
          - heading "Las sesenta preguntas" [level=2] [ref=f26e580]
          - paragraph [ref=f26e581]:
            - button "Saltar a 00:10:15" [ref=f26e582] [cursor=pointer]: 00:10:15
            - button "Copiar link a este momento" [ref=f26e583] [cursor=pointer]
            - strong [ref=f26e587]: "Ana Paula Sosa:"
            - text: "Les doy ejemplos de cada grupo para que se entienda el nivel. Del grupo estable: \"¿Cuál es el plazo genérico de prescripción liberatoria según el Código Civil y Comercial?\". Respuesta: cinco años, artículo 2560. Está en el Código desde 2015, está en todos los manuales, está en miles de fallos."
          - paragraph [ref=f26e588]:
            - button "Saltar a 00:10:42" [ref=f26e589] [cursor=pointer]: 00:10:42
            - button "Copiar link a este momento" [ref=f26e590] [cursor=pointer]
            - strong [ref=f26e594]: "Lucía Ferreyra:"
            - text: Del grupo de datos que cambian.
          - paragraph [ref=f26e595]:
            - button "Saltar a 00:10:46" [ref=f26e596] [cursor=pointer]: 00:10:46
            - button "Copiar link a este momento" [ref=f26e597] [cursor=pointer]
            - strong [ref=f26e601]: "Ana Paula Sosa:"
            - text: "\"¿Cuál es el plazo que tiene un organismo nacional para responder un pedido de acceso a la información pública según la Ley 27.275?\". Respuesta: quince días hábiles, prorrogables por otros quince con fundamento, artículo 11. Acá la trampa es que mucha gente recuerda el plazo del decreto anterior, que era distinto, y que hay regímenes provinciales con otros plazos."
          - paragraph [ref=f26e602]:
            - button "Saltar a 00:11:17" [ref=f26e603] [cursor=pointer]: 00:11:17
            - button "Copiar link a este momento" [ref=f26e604] [cursor=pointer]
            - strong [ref=f26e608]: "Martín Albarracín:"
            - text: Y del grupo de citas.
          - paragraph [ref=f26e609]:
            - button "Saltar a 00:11:20" [ref=f26e610] [cursor=pointer]: 00:11:20
            - button "Copiar link a este momento" [ref=f26e611] [cursor=pointer]
            - strong [ref=f26e615]: "Ana Paula Sosa:"
            - text: "\"¿Qué artículo de la Ley 24.240 regula el derecho de arrepentimiento en ventas a distancia y cuál es el plazo?\". Respuesta: artículo 34, diez días corridos. Es una ley muy modificada, y los números de artículo son de los que los modelos confunden."
          - paragraph [ref=f26e616]:
            - button "Saltar a 00:11:42" [ref=f26e617] [cursor=pointer]: 00:11:42
            - button "Copiar link a este momento" [ref=f26e618] [cursor=pointer]
            - strong [ref=f26e622]: "Julián Ortiz:"
            - text: "Algo que noté al cargar las preguntas: Ana Paula las escribió como las escribiría una persona que no es abogada, sin jerga, pero sin ambigüedad. Eso es muy difícil y es lo que hace que la prueba mida algo real."
          - paragraph [ref=f26e623]:
            - button "Saltar a 00:12:00" [ref=f26e624] [cursor=pointer]: 00:12:00
            - button "Copiar link a este momento" [ref=f26e625] [cursor=pointer]
            - strong [ref=f26e629]: "Ana Paula Sosa:"
            - text: Porque la pregunta que importa no es si un abogado puede sacarle una buena respuesta al sistema. Es si una persona que entra a preguntar porque no tiene abogado recibe una respuesta en la que puede confiar.
          - paragraph [ref=f26e630]:
            - button "Saltar a 00:12:17" [ref=f26e631] [cursor=pointer]: 00:12:17
            - button "Copiar link a este momento" [ref=f26e632] [cursor=pointer]
            - strong [ref=f26e636]: "Lucía Ferreyra:"
            - text: ¿Hubo preguntas que descartaron?
          - paragraph [ref=f26e637]:
            - button "Saltar a 00:12:21" [ref=f26e638] [cursor=pointer]: 00:12:21
            - button "Copiar link a este momento" [ref=f26e639] [cursor=pointer]
            - strong [ref=f26e643]: "Ana Paula Sosa:"
            - text: Varias. Descarté todas las que tenían una respuesta discutida en doctrina, porque no quería evaluar opiniones. Y descarté las que dependían de la jurisdicción sin decirlo. Cada pregunta dice "nacional" o nombra la provincia.
          - paragraph [ref=f26e644]:
            - button "Saltar a 00:12:42" [ref=f26e645] [cursor=pointer]: 00:12:42
            - button "Copiar link a este momento" [ref=f26e646] [cursor=pointer]
            - strong [ref=f26e650]: "Martín Albarracín:"
            - text: ¿Y preguntas con trampa? ¿Normas que no existen?
          - paragraph [ref=f26e651]:
            - button "Saltar a 00:12:47" [ref=f26e652] [cursor=pointer]: 00:12:47
            - button "Copiar link a este momento" [ref=f26e653] [cursor=pointer]
            - strong [ref=f26e657]: "Ana Paula Sosa:"
            - text: Cinco, dentro del grupo de citas. Preguntas del tipo "¿qué establece el decreto tal sobre tal cosa?" donde el decreto no existe o trata de otro tema. Quería ver si el sistema decía "ese decreto no existe" o inventaba un contenido.
          - paragraph [ref=f26e658]:
            - button "Saltar a 00:13:08" [ref=f26e659] [cursor=pointer]: 00:13:08
            - button "Copiar link a este momento" [ref=f26e660] [cursor=pointer]
            - strong [ref=f26e664]: "Julián Ortiz:"
            - text: Esa es la prueba más dura y más justa que se le puede hacer a un modelo de lenguaje. Un buen sistema dice "no encuentro esa norma". Uno malo te explica el decreto con artículos y todo.
          - paragraph [ref=f26e665]:
            - button "Saltar a 00:13:24" [ref=f26e666] [cursor=pointer]: 00:13:24
            - button "Copiar link a este momento" [ref=f26e667] [cursor=pointer]
            - strong [ref=f26e671]: "Lucía Ferreyra:"
            - text: "Adelanto: pasó lo segundo. Pero vamos en orden."
          - paragraph [ref=f26e672]:
            - button "Saltar a 00:13:32" [ref=f26e673] [cursor=pointer]: 00:13:32
            - button "Copiar link a este momento" [ref=f26e674] [cursor=pointer]
            - strong [ref=f26e678]: "Martín Albarracín:"
            - text: Antes de los resultados, un número que no es de la prueba pero da contexto. Julián, ¿cuánta gente usa estos sistemas para preguntas legales?
          - paragraph [ref=f26e679]:
            - button "Saltar a 00:13:44" [ref=f26e680] [cursor=pointer]: 00:13:44
            - button "Copiar link a este momento" [ref=f26e681] [cursor=pointer]
            - strong [ref=f26e685]: "Julián Ortiz:"
            - text: "No hay datos argentinos confiables y no voy a inventar uno. Lo que puedo decir es cualitativo: en los sistemas en los que trabajé, las consultas sobre trámites, derechos y normativa eran una categoría grande y creciente. La gente pregunta por el alquiler, por una multa, por un despido. Y pregunta a las once de la noche, cuando no hay a quién más preguntarle."
          - paragraph [ref=f26e686]:
            - button "Saltar a 00:14:12" [ref=f26e687] [cursor=pointer]: 00:14:12
            - button "Copiar link a este momento" [ref=f26e688] [cursor=pointer]
            - strong [ref=f26e692]: "Ana Paula Sosa:"
            - text: Que es el punto. No compiten con un abogado. Compiten con no preguntarle a nadie.
          - paragraph [ref=f26e693]:
            - button "Saltar a 00:14:20" [ref=f26e694] [cursor=pointer]: 00:14:20
            - button "Copiar link a este momento" [ref=f26e695] [cursor=pointer]
            - strong [ref=f26e699]: "Lucía Ferreyra:"
            - text: Esa comparación va a importar al final, cuando hablemos de qué hacer.
          - paragraph [ref=f26e700]:
            - button "Saltar a 00:14:28" [ref=f26e701] [cursor=pointer]: 00:14:28
            - button "Copiar link a este momento" [ref=f26e702] [cursor=pointer]
            - strong [ref=f26e706]: "Martín Albarracín:"
            - text: ¿Cuánto tardó la evaluación?
          - paragraph [ref=f26e707]:
            - button "Saltar a 00:14:31" [ref=f26e708] [cursor=pointer]: 00:14:31
            - button "Copiar link a este momento" [ref=f26e709] [cursor=pointer]
            - strong [ref=f26e713]: "Ana Paula Sosa:"
            - text: Dos semanas. Doscientas cuarenta respuestas, más doscientos cuarenta links. Cada respuesta contra su criterio escrito. Y donde dudé, lo anoté como duda en la planilla y la discutimos entre los tres, con la fuente adelante.
          - paragraph [ref=f26e714]:
            - button "Saltar a 00:14:52" [ref=f26e715] [cursor=pointer]: 00:14:52
            - button "Copiar link a este momento" [ref=f26e716] [cursor=pointer]
            - strong [ref=f26e720]: "Julián Ortiz:"
            - text: Hubo once casos de duda. En la planilla están marcados y está la resolución de cada uno.
          - paragraph [ref=f26e721]:
            - button "Saltar a 00:15:02" [ref=f26e722] [cursor=pointer]: 00:15:02
            - button "Copiar link a este momento" [ref=f26e723] [cursor=pointer]
            - strong [ref=f26e727]: "Lucía Ferreyra:"
            - text: Un ejemplo de duda.
          - paragraph [ref=f26e728]:
            - button "Saltar a 00:15:05" [ref=f26e729] [cursor=pointer]: 00:15:05
            - button "Copiar link a este momento" [ref=f26e730] [cursor=pointer]
            - strong [ref=f26e734]: "Ana Paula Sosa:"
            - text: Una respuesta sobre el plazo de la 27.275 que decía "quince días" sin aclarar hábiles. ¿Es correcta, incompleta o incorrecta? Para un ciudadano, "quince días" se entiende como corridos, y eso lo perjudica. La marcamos incompleta, y en la planilla está por qué.
          - paragraph [ref=f26e735]:
            - button "Saltar a 00:15:30" [ref=f26e736] [cursor=pointer]: 00:15:30
            - button "Copiar link a este momento" [ref=f26e737] [cursor=pointer]
            - strong [ref=f26e741]: "Martín Albarracín:"
            - text: "Esa distinción, correcta, incompleta, incorrecta, es importante para leer los números que siguen. \"Incompleta\" no es un error menor: en muchos casos la omisión te hace perder un plazo."
          - paragraph [ref=f26e742]:
            - button "Saltar a 00:15:46" [ref=f26e743] [cursor=pointer]: 00:15:46
            - button "Copiar link a este momento" [ref=f26e744] [cursor=pointer]
            - strong [ref=f26e748]: "Ana Paula Sosa:"
            - text: Para mí incompleta es peor que incorrecta en algunos casos, porque la incorrecta se detecta y la incompleta no.
          - paragraph [ref=f26e749]:
            - button "Saltar a 00:15:57" [ref=f26e750] [cursor=pointer]: 00:15:57
            - button "Copiar link a este momento" [ref=f26e751] [cursor=pointer]
            - strong [ref=f26e755]: "Lucía Ferreyra:"
            - text: Vamos a los resultados. Primero lo bueno.
          - 'heading "Resultados: lo que acertaron" [level=2] [ref=f26e756]'
          - paragraph [ref=f26e757]:
            - button "Saltar a 00:17:30" [ref=f26e758] [cursor=pointer]: 00:17:30
            - button "Copiar link a este momento" [ref=f26e759] [cursor=pointer]
            - strong [ref=f26e763]: "Martín Albarracín:"
            - text: "Grupo uno, normas estables, veinte preguntas por cuatro sistemas, ochenta respuestas. Los cuatro sistemas estuvieron entre dieciséis y diecinueve correctas de veinte. El resto, mayormente incompletas. Incorrectas en este grupo: tres en total, de ochenta."
          - paragraph [ref=f26e764]:
            - button "Saltar a 00:17:55" [ref=f26e765] [cursor=pointer]: 00:17:55
            - button "Copiar link a este momento" [ref=f26e766] [cursor=pointer]
            - strong [ref=f26e770]: "Ana Paula Sosa:"
            - text: "Y las tres incorrectas eran del mismo tipo: confundir el plazo genérico con un plazo especial. No disparates. Errores que un estudiante de tercer año también comete."
          - paragraph [ref=f26e771]:
            - button "Saltar a 00:18:10" [ref=f26e772] [cursor=pointer]: 00:18:10
            - button "Copiar link a este momento" [ref=f26e773] [cursor=pointer]
            - strong [ref=f26e777]: "Julián Ortiz:"
            - text: Esto no me sorprendió. El Código Civil y Comercial está en la red miles de veces, comentado, resumido, en fallos. Los modelos lo tienen muy bien representado. Para contenido estable y muy publicado, funcionan.
          - paragraph [ref=f26e778]:
            - button "Saltar a 00:18:28" [ref=f26e779] [cursor=pointer]: 00:18:28
            - button "Copiar link a este momento" [ref=f26e780] [cursor=pointer]
            - strong [ref=f26e784]: "Lucía Ferreyra:"
            - text: ¿Qué tan bien escritas estaban las respuestas correctas?
          - paragraph [ref=f26e785]:
            - button "Saltar a 00:18:33" [ref=f26e786] [cursor=pointer]: 00:18:33
            - button "Copiar link a este momento" [ref=f26e787] [cursor=pointer]
            - strong [ref=f26e791]: "Ana Paula Sosa:"
            - text: Muy bien. Eso hay que decirlo. Claras, en lenguaje llano, con ejemplos. Mejor que muchos sitios de organismos. Si yo tuviera que explicarle a alguien sin formación qué es la prescripción, varias de esas respuestas me servirían como base.
          - paragraph [ref=f26e792]:
            - button "Saltar a 00:18:55" [ref=f26e793] [cursor=pointer]: 00:18:55
            - button "Copiar link a este momento" [ref=f26e794] [cursor=pointer]
            - strong [ref=f26e798]: "Martín Albarracín:"
            - text: Grupo dos, datos que cambian. Acá se abre la diferencia entre sistemas. Los dos que tenían navegación activa estuvieron entre trece y quince correctas de veinte. Los dos sin navegación, entre ocho y once.
          - paragraph [ref=f26e799]:
            - button "Saltar a 00:19:15" [ref=f26e800] [cursor=pointer]: 00:19:15
            - button "Copiar link a este momento" [ref=f26e801] [cursor=pointer]
            - strong [ref=f26e805]: "Julián Ortiz:"
            - text: "Que es lo esperable: sin navegación, el modelo responde con lo que sabía a su fecha de corte. Si el plazo cambió después, responde el viejo. Con navegación, a veces encuentra la norma nueva. A veces."
          - paragraph [ref=f26e806]:
            - button "Saltar a 00:19:33" [ref=f26e807] [cursor=pointer]: 00:19:33
            - button "Copiar link a este momento" [ref=f26e808] [cursor=pointer]
            - strong [ref=f26e812]: "Ana Paula Sosa:"
            - text: Lo que me llamó la atención en este grupo fue la pregunta sobre la autoridad de aplicación. Varios sistemas nombraron un organismo que fue reestructurado y cambió de nombre. La respuesta era correcta hace tres años. Y la daban en presente.
          - paragraph [ref=f26e813]:
            - button "Saltar a 00:19:55" [ref=f26e814] [cursor=pointer]: 00:19:55
            - button "Copiar link a este momento" [ref=f26e815] [cursor=pointer]
            - strong [ref=f26e819]: "Lucía Ferreyra:"
            - text: Sin señal de duda.
          - paragraph [ref=f26e820]:
            - button "Saltar a 00:19:58" [ref=f26e821] [cursor=pointer]: 00:19:58
            - button "Copiar link a este momento" [ref=f26e822] [cursor=pointer]
            - strong [ref=f26e826]: "Ana Paula Sosa:"
            - text: Vamos a esa columna porque es el dato que más me importa. De las doscientas cuarenta respuestas, las que incluían alguna señal de incertidumbre fueron veintitrés. Y de esas veintitrés, la mayoría eran respuestas correctas. Es decir, los sistemas dudaban cuando acertaban y afirmaban cuando se equivocaban.
          - paragraph [ref=f26e827]:
            - button "Saltar a 00:20:25" [ref=f26e828] [cursor=pointer]: 00:20:25
            - button "Copiar link a este momento" [ref=f26e829] [cursor=pointer]
            - strong [ref=f26e833]: "Martín Albarracín:"
            - text: Quiero que eso quede claro porque es contraintuitivo. La señal de duda no está correlacionada con el error. Si acaso, al revés.
          - paragraph [ref=f26e834]:
            - button "Saltar a 00:20:36" [ref=f26e835] [cursor=pointer]: 00:20:36
            - button "Copiar link a este momento" [ref=f26e836] [cursor=pointer]
            - strong [ref=f26e840]: "Julián Ortiz:"
            - text: Tiene una explicación técnica. Los sistemas están entrenados para agregar frases como "consultá con un profesional" en temas legales, como medida de cobertura. Eso aparece en cualquier respuesta legal, acierte o no. No es una estimación real de la confianza del modelo. Es un disclaimer de fábrica.
          - paragraph [ref=f26e841]:
            - button "Saltar a 00:21:02" [ref=f26e842] [cursor=pointer]: 00:21:02
            - button "Copiar link a este momento" [ref=f26e843] [cursor=pointer]
            - strong [ref=f26e847]: "Ana Paula Sosa:"
            - text: Que para el usuario es ruido. Si todas las respuestas dicen "consultá con un profesional", ninguna lo dice.
          - paragraph [ref=f26e848]:
            - button "Saltar a 00:21:12" [ref=f26e849] [cursor=pointer]: 00:21:12
            - button "Copiar link a este momento" [ref=f26e850] [cursor=pointer]
            - strong [ref=f26e854]: "Lucía Ferreyra:"
            - text: Volvamos a lo que acertaron, que todavía estamos ahí. En el grupo dos, ¿qué tipo de pregunta respondieron bien?
          - paragraph [ref=f26e855]:
            - button "Saltar a 00:21:21" [ref=f26e856] [cursor=pointer]: 00:21:21
            - button "Copiar link a este momento" [ref=f26e857] [cursor=pointer]
            - strong [ref=f26e861]: "Ana Paula Sosa:"
            - text: "Las de plazos de leyes que no se modificaron en los últimos años, aunque fueran menos conocidas. Y las de competencia: qué organismo hace qué, siempre que el organismo no hubiera cambiado."
          - paragraph [ref=f26e862]:
            - button "Saltar a 00:21:38" [ref=f26e863] [cursor=pointer]: 00:21:38
            - button "Copiar link a este momento" [ref=f26e864] [cursor=pointer]
            - strong [ref=f26e868]: "Martín Albarracín:"
            - text: Grupo tres, citas precisas. Acá los números bajan en todos. Entre siete y doce correctas de veinte, según el sistema. Y, a diferencia de los otros grupos, muchas incorrectas, no incompletas.
          - paragraph [ref=f26e869]:
            - button "Saltar a 00:21:57" [ref=f26e870] [cursor=pointer]: 00:21:57
            - button "Copiar link a este momento" [ref=f26e871] [cursor=pointer]
            - strong [ref=f26e875]: "Julián Ortiz:"
            - text: Pero antes de ir a lo malo, quiero rescatar algo del grupo tres. Las preguntas que pedían el artículo de una norma muy citada, como el artículo 34 de la 24.240 o el 2560 del Código, las acertaron casi todos. El problema fue con los artículos de normas menos famosas.
          - paragraph [ref=f26e876]:
            - button "Saltar a 00:22:20" [ref=f26e877] [cursor=pointer]: 00:22:20
            - button "Copiar link a este momento" [ref=f26e878] [cursor=pointer]
            - strong [ref=f26e882]: "Ana Paula Sosa:"
            - text: "Sí. Hay una regla que se puede extraer: cuanto más citada es una norma en internet, más probable que el número de artículo esté bien. Eso es útil para saber cuándo desconfiar."
          - paragraph [ref=f26e883]:
            - button "Saltar a 00:22:36" [ref=f26e884] [cursor=pointer]: 00:22:36
            - button "Copiar link a este momento" [ref=f26e885] [cursor=pointer]
            - strong [ref=f26e889]: "Lucía Ferreyra:"
            - text: Resumen de lo bueno, en una frase cada uno.
          - paragraph [ref=f26e890]:
            - button "Saltar a 00:22:41" [ref=f26e891] [cursor=pointer]: 00:22:41
            - button "Copiar link a este momento" [ref=f26e892] [cursor=pointer]
            - strong [ref=f26e896]: "Ana Paula Sosa:"
            - text: Para explicar qué dice una norma conocida en lenguaje claro, sirven.
          - paragraph [ref=f26e897]:
            - button "Saltar a 00:22:48" [ref=f26e898] [cursor=pointer]: 00:22:48
            - button "Copiar link a este momento" [ref=f26e899] [cursor=pointer]
            - strong [ref=f26e903]: "Julián Ortiz:"
            - text: Para datos estables y muy publicados, son confiables en un nivel comparable a una buena búsqueda.
          - paragraph [ref=f26e904]:
            - button "Saltar a 00:22:56" [ref=f26e905] [cursor=pointer]: 00:22:56
            - button "Copiar link a este momento" [ref=f26e906] [cursor=pointer]
            - strong [ref=f26e910]: "Martín Albarracín:"
            - text: "Y para preguntas donde la respuesta no cambió en años, el tipo de sistema importa poco: todos anduvieron."
          - paragraph [ref=f26e911]:
            - button "Saltar a 00:23:06" [ref=f26e912] [cursor=pointer]: 00:23:06
            - button "Copiar link a este momento" [ref=f26e913] [cursor=pointer]
            - strong [ref=f26e917]: "Lucía Ferreyra:"
            - text: Ahora, lo otro.
          - 'heading "Resultados: dónde inventaron" [level=2] [ref=f26e918]'
          - paragraph [ref=f26e919]:
            - button "Saltar a 00:24:50" [ref=f26e920] [cursor=pointer]: 00:24:50
            - button "Copiar link a este momento" [ref=f26e921] [cursor=pointer]
            - strong [ref=f26e925]: "Martín Albarracín:"
            - text: Las cinco preguntas trampa. Decretos que no existen o que tratan de otro tema. Veinte respuestas en total, cinco por sistema.
          - paragraph [ref=f26e926]:
            - button "Saltar a 00:25:02" [ref=f26e927] [cursor=pointer]: 00:25:02
            - button "Copiar link a este momento" [ref=f26e928] [cursor=pointer]
            - strong [ref=f26e932]: "Ana Paula Sosa:"
            - text: Catorce de veinte explicaron el contenido del decreto inexistente. Con artículos. Con fecha de publicación. Con organismo. Tres dijeron que no encontraban la norma. Tres dieron una respuesta ambigua, del tipo "ese decreto regula aspectos relacionados con", sin comprometerse.
          - paragraph [ref=f26e933]:
            - button "Saltar a 00:25:28" [ref=f26e934] [cursor=pointer]: 00:25:28
            - button "Copiar link a este momento" [ref=f26e935] [cursor=pointer]
            - strong [ref=f26e939]: "Julián Ortiz:"
            - text: Catorce de veinte es mucho peor de lo que yo esperaba, y lo digo como alguien que defiende estos sistemas. Es el caso donde el modelo tiene toda la información para decir "no sé" y elige completar.
          - paragraph [ref=f26e940]:
            - button "Saltar a 00:25:44" [ref=f26e941] [cursor=pointer]: 00:25:44
            - button "Copiar link a este momento" [ref=f26e942] [cursor=pointer]
            - strong [ref=f26e946]: "Lucía Ferreyra:"
            - text: Danos un ejemplo concreto.
          - paragraph [ref=f26e947]:
            - button "Saltar a 00:25:48" [ref=f26e948] [cursor=pointer]: 00:25:48
            - button "Copiar link a este momento" [ref=f26e949] [cursor=pointer]
            - strong [ref=f26e953]: "Ana Paula Sosa:"
            - text: "Preguntamos por un decreto con un número que no corresponde a ninguno publicado ese año, sobre \"régimen de notificaciones electrónicas en el procedimiento administrativo\". Un sistema respondió con una explicación de cuatro párrafos: objeto, ámbito de aplicación, obligaciones de los organismos, plazos de entrada en vigencia. Todo inventado. Todo verosímil. Si yo no supiera que el decreto no existe, lo citaba."
          - paragraph [ref=f26e954]:
            - button "Saltar a 00:26:22" [ref=f26e955] [cursor=pointer]: 00:26:22
            - button "Copiar link a este momento" [ref=f26e956] [cursor=pointer]
            - strong [ref=f26e960]: "Martín Albarracín:"
            - text: Y cuando le pidieron el link.
          - paragraph [ref=f26e961]:
            - button "Saltar a 00:26:25" [ref=f26e962] [cursor=pointer]: 00:26:25
            - button "Copiar link a este momento" [ref=f26e963] [cursor=pointer]
            - strong [ref=f26e967]: "Ana Paula Sosa:"
            - text: Dio un link al Boletín Oficial con el formato correcto de los links del Boletín Oficial. El link no existe. Lleva a un error.
          - paragraph [ref=f26e968]:
            - button "Saltar a 00:26:38" [ref=f26e969] [cursor=pointer]: 00:26:38
            - button "Copiar link a este momento" [ref=f26e970] [cursor=pointer]
            - strong [ref=f26e974]: "Julián Ortiz:"
            - text: "El formato correcto es lo que lo hace peligroso. El modelo aprendió cómo se ven los links de boletinoficial.gob.ar y genera uno que se ve igual. No tiene forma de saber si existe, porque no lo está buscando: lo está escribiendo."
          - paragraph [ref=f26e975]:
            - button "Saltar a 00:26:56" [ref=f26e976] [cursor=pointer]: 00:26:56
            - button "Copiar link a este momento" [ref=f26e977] [cursor=pointer]
            - strong [ref=f26e981]: "Lucía Ferreyra:"
            - text: Ana Paula, lo que dijiste antes de grabar.
          - paragraph [ref=f26e982]:
            - button "Saltar a 00:27:05" [ref=f26e983] [cursor=pointer]: 00:27:05
            - button "Copiar link a este momento" [ref=f26e984] [cursor=pointer]
            - strong [ref=f26e988]: "Ana Paula Sosa:"
            - text: El problema no es que se equivoquen. Es que se equivocan con la misma cara con la que aciertan. Una persona que no sabe no puede distinguir. Y una persona que sabe tiene que verificar todo, con lo cual el tiempo que ahorró lo pierde.
          - paragraph [ref=f26e989]:
            - button "Saltar a 00:27:27" [ref=f26e990] [cursor=pointer]: 00:27:27
            - button "Copiar link a este momento" [ref=f26e991] [cursor=pointer]
            - strong [ref=f26e995]: "Martín Albarracín:"
            - text: Los links en general, no solo los de las trampas. Doscientos cuarenta pedidos de fuente.
          - paragraph [ref=f26e996]:
            - button "Saltar a 00:27:35" [ref=f26e997] [cursor=pointer]: 00:27:35
            - button "Copiar link a este momento" [ref=f26e998] [cursor=pointer]
            - strong [ref=f26e1002]: "Julián Ortiz:"
            - text: "Los clasificamos en cuatro: link correcto a la norma exacta; link a InfoLEG o al Boletín pero a otra norma; link con formato válido que no existe; y sin link, con una respuesta del tipo \"podés buscarlo en InfoLEG\". Los sistemas con navegación dieron muchos más links correctos. Los sin navegación dieron una proporción alta de links inexistentes y de links a otras normas."
          - paragraph [ref=f26e1003]:
            - button "Saltar a 00:28:08" [ref=f26e1004] [cursor=pointer]: 00:28:08
            - button "Copiar link a este momento" [ref=f26e1005] [cursor=pointer]
            - strong [ref=f26e1009]: "Ana Paula Sosa:"
            - text: "El que más me preocupa es el segundo tipo: un link real, que abre, que lleva a InfoLEG, pero a otra ley. Porque la persona ve que el link funciona, ve el logo del ministerio, y confía. No lee que es otra norma."
          - paragraph [ref=f26e1010]:
            - button "Saltar a 00:28:28" [ref=f26e1011] [cursor=pointer]: 00:28:28
            - button "Copiar link a este momento" [ref=f26e1012] [cursor=pointer]
            - strong [ref=f26e1016]: "Lucía Ferreyra:"
            - text: Volvamos al grupo tres completo, las citas. ¿Qué tipos de error aparecieron?
          - paragraph [ref=f26e1017]:
            - button "Saltar a 00:28:35" [ref=f26e1018] [cursor=pointer]: 00:28:35
            - button "Copiar link a este momento" [ref=f26e1019] [cursor=pointer]
            - strong [ref=f26e1023]: "Ana Paula Sosa:"
            - text: "Cuatro tipos, que adaptamos de la tipología del paper de Stanford y Yale que linkeamos. Número de artículo incorrecto: la norma es la correcta pero el artículo es otro. Norma incorrecta: el contenido es correcto pero lo atribuye a otra ley. Organismo incorrecto: una resolución real atribuida a otro organismo. Y norma inexistente, que es la trampa pero también apareció espontáneamente en preguntas normales."
          - paragraph [ref=f26e1024]:
            - button "Saltar a 00:29:10" [ref=f26e1025] [cursor=pointer]: 00:29:10
            - button "Copiar link a este momento" [ref=f26e1026] [cursor=pointer]
            - strong [ref=f26e1030]: "Martín Albarracín:"
            - text: ¿Espontáneamente?
          - paragraph [ref=f26e1031]:
            - button "Saltar a 00:29:13" [ref=f26e1032] [cursor=pointer]: 00:29:13
            - button "Copiar link a este momento" [ref=f26e1033] [cursor=pointer]
            - strong [ref=f26e1037]: "Ana Paula Sosa:"
            - text: En cuatro respuestas a preguntas legítimas, el sistema citó, para reforzar, una resolución o un decreto que no existe. No se lo pedimos. Lo agregó como apoyo. Y es lo que hace que una respuesta parezca más sólida.
          - paragraph [ref=f26e1038]:
            - button "Saltar a 00:29:32" [ref=f26e1039] [cursor=pointer]: 00:29:32
            - button "Copiar link a este momento" [ref=f26e1040] [cursor=pointer]
            - strong [ref=f26e1044]: "Julián Ortiz:"
            - text: "Eso es importante: la"
            - link "alucinación" [ref=f26e1045] [cursor=pointer]:
              - /url: /glosario/alucinacion
            - text: no aparece solo cuando preguntás por algo falso. Aparece como decoración de respuestas correctas. El núcleo de la respuesta está bien y la cita de apoyo está inventada.
          - paragraph [ref=f26e1046]:
            - button "Saltar a 00:29:50" [ref=f26e1047] [cursor=pointer]: 00:29:50
            - button "Copiar link a este momento" [ref=f26e1048] [cursor=pointer]
            - strong [ref=f26e1052]: "Lucía Ferreyra:"
            - text: ¿Hubo diferencias grandes entre sistemas en este grupo?
          - paragraph [ref=f26e1053]:
            - button "Saltar a 00:29:55" [ref=f26e1054] [cursor=pointer]: 00:29:55
            - button "Copiar link a este momento" [ref=f26e1055] [cursor=pointer]
            - strong [ref=f26e1059]: "Julián Ortiz:"
            - text: Hubo diferencias, y están en la planilla por sistema. Pero insisto en no convertirlo en ranking porque la diferencia entre el mejor y el peor en citas fue menor que la diferencia entre el grupo uno y el grupo tres en cualquier sistema. El tipo de pregunta importa más que el producto.
          - paragraph [ref=f26e1060]:
            - button "Saltar a 00:30:18" [ref=f26e1061] [cursor=pointer]: 00:30:18
            - button "Copiar link a este momento" [ref=f26e1062] [cursor=pointer]
            - strong [ref=f26e1066]: "Martín Albarracín:"
            - text: Eso es un hallazgo en sí mismo. Si estás eligiendo un sistema, la pregunta no es cuál sino para qué.
          - paragraph [ref=f26e1067]:
            - button "Saltar a 00:30:28" [ref=f26e1068] [cursor=pointer]: 00:30:28
            - button "Copiar link a este momento" [ref=f26e1069] [cursor=pointer]
            - strong [ref=f26e1073]: "Ana Paula Sosa:"
            - text: Una última cosa de este bloque. Las respuestas incorrectas estaban, en promedio, mejor escritas que las correctas. Más largas, más estructuradas, con más subtítulos. Lo medimos a ojo, no es una estadística, pero los tres lo notamos.
          - paragraph [ref=f26e1074]:
            - button "Saltar a 00:30:48" [ref=f26e1075] [cursor=pointer]: 00:30:48
            - button "Copiar link a este momento" [ref=f26e1076] [cursor=pointer]
            - strong [ref=f26e1080]: "Julián Ortiz:"
            - text: Tiene lógica. Cuando el modelo no tiene el dato, genera más texto alrededor. Cuando lo tiene, responde y listo.
          - paragraph [ref=f26e1081]:
            - button "Saltar a 00:30:58" [ref=f26e1082] [cursor=pointer]: 00:30:58
            - button "Copiar link a este momento" [ref=f26e1083] [cursor=pointer]
            - strong [ref=f26e1087]: "Lucía Ferreyra:"
            - text: O sea que la longitud y la prolijidad son una señal de alerta, no de calidad.
          - paragraph [ref=f26e1088]:
            - button "Saltar a 00:31:05" [ref=f26e1089] [cursor=pointer]: 00:31:05
            - button "Copiar link a este momento" [ref=f26e1090] [cursor=pointer]
            - strong [ref=f26e1094]: "Ana Paula Sosa:"
            - text: En este dominio, sí. Y es exactamente al revés de cómo lee la gente.
          - paragraph [ref=f26e1095]:
            - button "Saltar a 00:31:15" [ref=f26e1096] [cursor=pointer]: 00:31:15
            - button "Copiar link a este momento" [ref=f26e1097] [cursor=pointer]
            - strong [ref=f26e1101]: "Martín Albarracín:"
            - text: Vamos a por qué pasa esto, porque sin eso no se puede pensar qué hacer.
          - heading "Por qué pasa esto" [level=2] [ref=f26e1102]
          - paragraph [ref=f26e1103]:
            - button "Saltar a 00:32:10" [ref=f26e1104] [cursor=pointer]: 00:32:10
            - button "Copiar link a este momento" [ref=f26e1105] [cursor=pointer]
            - strong [ref=f26e1109]: "Julián Ortiz:"
            - text: Voy a tratar de explicarlo sin jerga. Un modelo de lenguaje genera texto palabra por palabra, eligiendo cada vez la continuación más probable según lo que vio en su entrenamiento. Cuando le preguntás por el artículo 2560 del Código, esa secuencia apareció tantas veces que la probabilidad de "cinco años" es altísima. Cuando le preguntás por un decreto oscuro, no hay secuencia memorizada, y el modelo igual tiene que elegir la palabra siguiente. Elige la que mejor suena.
          - paragraph [ref=f26e1110]:
            - button "Saltar a 00:32:50" [ref=f26e1111] [cursor=pointer]: 00:32:50
            - button "Copiar link a este momento" [ref=f26e1112] [cursor=pointer]
            - strong [ref=f26e1116]: "Lucía Ferreyra:"
            - text: No tiene un paso de "no sé".
          - paragraph [ref=f26e1117]:
            - button "Saltar a 00:32:53" [ref=f26e1118] [cursor=pointer]: 00:32:53
            - button "Copiar link a este momento" [ref=f26e1119] [cursor=pointer]
            - strong [ref=f26e1123]: "Julián Ortiz:"
            - text: Tiene algo parecido, pero es débil. Los sistemas se entrenan además para ser útiles y para responder, y eso empuja hacia completar. Decir "no existe ese decreto" requiere que el modelo haya aprendido específicamente a hacerlo, y es una conducta que se entrena menos porque es menos frecuente en los datos.
          - paragraph [ref=f26e1124]:
            - button "Saltar a 00:33:18" [ref=f26e1125] [cursor=pointer]: 00:33:18
            - button "Copiar link a este momento" [ref=f26e1126] [cursor=pointer]
            - strong [ref=f26e1130]: "Ana Paula Sosa:"
            - text: "Desde el derecho, lo que yo veo es que el modelo aprendió la forma del discurso jurídico, que es muy regular: \"el artículo tal establece\", \"conforme el decreto tal\", \"la autoridad de aplicación es\". Aprendió el molde. Y llena el molde con lo que tenga."
          - paragraph [ref=f26e1131]:
            - button "Saltar a 00:33:40" [ref=f26e1132] [cursor=pointer]: 00:33:40
            - button "Copiar link a este momento" [ref=f26e1133] [cursor=pointer]
            - strong [ref=f26e1137]: "Martín Albarracín:"
            - text: "Lo segundo: la fecha de corte."
          - paragraph [ref=f26e1138]:
            - button "Saltar a 00:33:44" [ref=f26e1139] [cursor=pointer]: 00:33:44
            - button "Copiar link a este momento" [ref=f26e1140] [cursor=pointer]
            - strong [ref=f26e1144]: "Julián Ortiz:"
            - text: "Cada modelo se entrena con datos hasta cierta fecha. Lo que pasó después no lo sabe, salvo que navegue. Y la normativa argentina cambia mucho: plazos, montos, organismos. Un modelo con corte de hace un año responde con el mundo de hace un año, y lo responde en presente, porque no tiene noción del tiempo."
          - paragraph [ref=f26e1145]:
            - button "Saltar a 00:34:08" [ref=f26e1146] [cursor=pointer]: 00:34:08
            - button "Copiar link a este momento" [ref=f26e1147] [cursor=pointer]
            - strong [ref=f26e1151]: "Ana Paula Sosa:"
            - text: Eso explica el grupo dos casi completo.
          - paragraph [ref=f26e1152]:
            - button "Saltar a 00:34:12" [ref=f26e1153] [cursor=pointer]: 00:34:12
            - button "Copiar link a este momento" [ref=f26e1154] [cursor=pointer]
            - strong [ref=f26e1158]: "Lucía Ferreyra:"
            - text: "Lo tercero, que me parece menos discutido: la representación de la normativa argentina en los datos de entrenamiento."
          - paragraph [ref=f26e1159]:
            - button "Saltar a 00:34:22" [ref=f26e1160] [cursor=pointer]: 00:34:22
            - button "Copiar link a este momento" [ref=f26e1161] [cursor=pointer]
            - strong [ref=f26e1165]: "Julián Ortiz:"
            - text: Es un punto clave. Estos modelos se entrenan mayormente con texto en inglés, y dentro del español, con lo que más circula. El derecho argentino está en InfoLEG, en el Boletín, en fallos, en algunos blogs. Comparado con el derecho de Estados Unidos, es una fracción minúscula. El modelo sabe mucho menos de la 27.275 que de cualquier ley federal norteamericana, y cuando sabe menos, completa más.
          - paragraph [ref=f26e1166]:
            - button "Saltar a 00:34:55" [ref=f26e1167] [cursor=pointer]: 00:34:55
            - button "Copiar link a este momento" [ref=f26e1168] [cursor=pointer]
            - strong [ref=f26e1172]: "Ana Paula Sosa:"
            - text: Y a veces completa con derecho de otro país. Vimos dos respuestas que describían un procedimiento que es correcto en España y no en Argentina. Con terminología española.
          - paragraph [ref=f26e1173]:
            - button "Saltar a 00:35:10" [ref=f26e1174] [cursor=pointer]: 00:35:10
            - button "Copiar link a este momento" [ref=f26e1175] [cursor=pointer]
            - strong [ref=f26e1179]: "Martín Albarracín:"
            - text: O sea que el modelo "piensa" en el sistema jurídico que más vio.
          - paragraph [ref=f26e1180]:
            - button "Saltar a 00:35:16" [ref=f26e1181] [cursor=pointer]: 00:35:16
            - button "Copiar link a este momento" [ref=f26e1182] [cursor=pointer]
            - strong [ref=f26e1186]: "Julián Ortiz:"
            - text: No piensa, pero la tendencia es esa. Es un sesgo de los datos de entrenamiento que tiene consecuencias directas para un país chico en volumen de texto.
          - paragraph [ref=f26e1187]:
            - button "Saltar a 00:35:30" [ref=f26e1188] [cursor=pointer]: 00:35:30
            - button "Copiar link a este momento" [ref=f26e1189] [cursor=pointer]
            - strong [ref=f26e1193]: "Lucía Ferreyra:"
            - text: "Lo cuarto: los links."
          - paragraph [ref=f26e1194]:
            - button "Saltar a 00:35:33" [ref=f26e1195] [cursor=pointer]: 00:35:33
            - button "Copiar link a este momento" [ref=f26e1196] [cursor=pointer]
            - strong [ref=f26e1200]: "Julián Ortiz:"
            - text: "Un modelo sin navegación no puede consultar una URL. Cuando le pedís un link, hace lo mismo que con el texto: genera la secuencia de caracteres más probable. Para boletinoficial.gob.ar hay un patrón, con números, y el modelo lo reproduce. No está mintiendo en el sentido humano: está completando un patrón. Pero el resultado es un link falso con aspecto de verdadero."
          - paragraph [ref=f26e1201]:
            - button "Saltar a 00:36:03" [ref=f26e1202] [cursor=pointer]: 00:36:03
            - button "Copiar link a este momento" [ref=f26e1203] [cursor=pointer]
            - strong [ref=f26e1207]: "Ana Paula Sosa:"
            - text: "Para mí esto debería estar en la pantalla de cualquier sistema que se use en el Estado: \"los links de esta respuesta pueden no existir\". Con esas palabras."
          - paragraph [ref=f26e1208]:
            - button "Saltar a 00:36:17" [ref=f26e1209] [cursor=pointer]: 00:36:17
            - button "Copiar link a este momento" [ref=f26e1210] [cursor=pointer]
            - strong [ref=f26e1214]: "Martín Albarracín:"
            - text: Y con navegación mejora, pero.
          - paragraph [ref=f26e1215]:
            - button "Saltar a 00:36:20" [ref=f26e1216] [cursor=pointer]: 00:36:20
            - button "Copiar link a este momento" [ref=f26e1217] [cursor=pointer]
            - strong [ref=f26e1221]: "Julián Ortiz:"
            - text: "Mejora mucho en links y en datos recientes. Pero introduce otro problema: el sistema busca, encuentra tres páginas, y elige. Si elige un blog desactualizado en vez de InfoLEG, responde mal con un link real. Vimos varios de esos."
          - paragraph [ref=f26e1222]:
            - button "Saltar a 00:36:42" [ref=f26e1223] [cursor=pointer]: 00:36:42
            - button "Copiar link a este momento" [ref=f26e1224] [cursor=pointer]
            - strong [ref=f26e1228]: "Lucía Ferreyra:"
            - text: Última causa, que es institucional y no técnica.
          - paragraph [ref=f26e1229]:
            - button "Saltar a 00:36:47" [ref=f26e1230] [cursor=pointer]: 00:36:47
            - button "Copiar link a este momento" [ref=f26e1231] [cursor=pointer]
            - strong [ref=f26e1235]: "Ana Paula Sosa:"
            - text: Que no hay un
            - link "benchmark" [ref=f26e1236] [cursor=pointer]:
              - /url: /glosario/benchmark
            - text: público de normativa argentina. No existe un conjunto de preguntas con respuesta verificada que cualquiera pueda usar para medir un sistema antes de ponerlo a responder al público. Nuestra prueba de sesenta es un intento mínimo. Debería existir uno de miles, mantenido por un organismo o una universidad, actualizado cuando cambia la norma.
          - paragraph [ref=f26e1237]:
            - button "Saltar a 00:37:15" [ref=f26e1238] [cursor=pointer]: 00:37:15
            - button "Copiar link a este momento" [ref=f26e1239] [cursor=pointer]
            - strong [ref=f26e1243]: "Julián Ortiz:"
            - text: Y con eso, los proveedores podrían decir "nuestro sistema acierta tanto en el benchmark argentino" y un funcionario podría exigirlo en un pliego.
          - paragraph [ref=f26e1244]:
            - button "Saltar a 00:37:27" [ref=f26e1245] [cursor=pointer]: 00:37:27
            - button "Copiar link a este momento" [ref=f26e1246] [cursor=pointer]
            - strong [ref=f26e1250]: "Martín Albarracín:"
            - text: Hoy el pliego dice "inteligencia artificial" y nada más.
          - paragraph [ref=f26e1251]:
            - button "Saltar a 00:37:32" [ref=f26e1252] [cursor=pointer]: 00:37:32
            - button "Copiar link a este momento" [ref=f26e1253] [cursor=pointer]
            - strong [ref=f26e1257]: "Ana Paula Sosa:"
            - text: Hoy el pliego dice lo que dice la demo.
          - paragraph [ref=f26e1258]:
            - button "Saltar a 00:37:38" [ref=f26e1259] [cursor=pointer]: 00:37:38
            - button "Copiar link a este momento" [ref=f26e1260] [cursor=pointer]
            - strong [ref=f26e1264]: "Lucía Ferreyra:"
            - text: Lo que puede hacer un organismo.
          - heading "Qué puede hacer un organismo" [level=2] [ref=f26e1265]
          - paragraph [ref=f26e1266]:
            - button "Saltar a 00:39:20" [ref=f26e1267] [cursor=pointer]: 00:39:20
            - button "Copiar link a este momento" [ref=f26e1268] [cursor=pointer]
            - strong [ref=f26e1272]: "Martín Albarracín:"
            - text: Supongamos que alguien que nos escucha trabaja en un organismo y tiene que decidir si pone un sistema de estos a responder al público. Tres recomendaciones por cabeza.
          - paragraph [ref=f26e1273]:
            - button "Saltar a 00:39:33" [ref=f26e1274] [cursor=pointer]: 00:39:33
            - button "Copiar link a este momento" [ref=f26e1275] [cursor=pointer]
            - strong [ref=f26e1279]: "Ana Paula Sosa:"
            - text: "Primera: definir qué tipo de pregunta va a responder. Si es explicar qué dice una norma estable en lenguaje claro, los datos dicen que puede funcionar con revisión. Si es dar plazos, montos o citas, no sin conectarlo a la fuente oficial y mostrar la fuente en cada respuesta."
          - paragraph [ref=f26e1280]:
            - button "Saltar a 00:39:58" [ref=f26e1281] [cursor=pointer]: 00:39:58
            - button "Copiar link a este momento" [ref=f26e1282] [cursor=pointer]
            - strong [ref=f26e1286]: "Julián Ortiz:"
            - text: "Segunda: conectarlo a la fuente oficial no es opcional. Técnicamente se llama"
            - link "recuperación aumentada" [ref=f26e1287] [cursor=pointer]:
              - /url: /glosario/recuperacion-aumentada
            - text: ": el sistema busca en InfoLEG, en el Boletín o en los documentos del organismo y responde a partir de eso, con el link al documento que usó. No elimina errores, pero cambia la pregunta de \"¿el modelo sabe?\" a \"¿el modelo leyó bien el documento correcto?\", que es verificable."
          - paragraph [ref=f26e1288]:
            - button "Saltar a 00:40:30" [ref=f26e1289] [cursor=pointer]: 00:40:30
            - button "Copiar link a este momento" [ref=f26e1290] [cursor=pointer]
            - strong [ref=f26e1294]: "Lucía Ferreyra:"
            - text: Tercera.
          - paragraph [ref=f26e1295]:
            - button "Saltar a 00:40:32" [ref=f26e1296] [cursor=pointer]: 00:40:32
            - button "Copiar link a este momento" [ref=f26e1297] [cursor=pointer]
            - strong [ref=f26e1301]: "Ana Paula Sosa:"
            - text: "Que cada respuesta diga de dónde sale. Si no tiene fuente, que lo diga. Y que el sistema tenga prohibido generar links: los links tienen que venir del documento recuperado, no del modelo."
          - paragraph [ref=f26e1302]:
            - button "Saltar a 00:40:50" [ref=f26e1303] [cursor=pointer]: 00:40:50
            - button "Copiar link a este momento" [ref=f26e1304] [cursor=pointer]
            - strong [ref=f26e1308]: "Julián Ortiz:"
            - text: "Cuarta, mía: medir antes de lanzar y después de cada cambio. Con un conjunto de preguntas como el nuestro, adaptado al organismo. Si la precisión en citas baja de cierto umbral, el sistema no responde ese tipo de pregunta y deriva a una persona."
          - paragraph [ref=f26e1309]:
            - button "Saltar a 00:41:12" [ref=f26e1310] [cursor=pointer]: 00:41:12
            - button "Copiar link a este momento" [ref=f26e1311] [cursor=pointer]
            - strong [ref=f26e1315]: "Martín Albarracín:"
            - text: "Quinta: publicar las métricas. Si un organismo pone un sistema a responder, que publique cuántas preguntas recibe, qué porcentaje deriva y los resultados de la evaluación. Como"
            - link "datos abiertos" [ref=f26e1316] [cursor=pointer]:
              - /url: /glosario/datos-abiertos
            - text: .
          - paragraph [ref=f26e1317]:
            - button "Saltar a 00:41:30" [ref=f26e1318] [cursor=pointer]: 00:41:30
            - button "Copiar link a este momento" [ref=f26e1319] [cursor=pointer]
            - strong [ref=f26e1323]: "Ana Paula Sosa:"
            - text: "Y sexta, la más simple: una línea, arriba de cada respuesta, que diga \"esta respuesta fue generada automáticamente y puede contener errores; verificá en la fuente antes de actuar\". No en letra chica. Arriba."
          - paragraph [ref=f26e1324]:
            - button "Saltar a 00:41:50" [ref=f26e1325] [cursor=pointer]: 00:41:50
            - button "Copiar link a este momento" [ref=f26e1326] [cursor=pointer]
            - strong [ref=f26e1330]: "Lucía Ferreyra:"
            - text: ¿Y para una persona común, que no es organismo? ¿Qué le dirían?
          - paragraph [ref=f26e1331]:
            - button "Saltar a 00:41:57" [ref=f26e1332] [cursor=pointer]: 00:41:57
            - button "Copiar link a este momento" [ref=f26e1333] [cursor=pointer]
            - strong [ref=f26e1337]: "Ana Paula Sosa:"
            - text: Que use el chatbot para entender, no para citar. Para que te explique qué es la prescripción, sirve. Para saber si tu plazo venció, andá a la fuente o a una persona.
          - paragraph [ref=f26e1338]:
            - button "Saltar a 00:42:12" [ref=f26e1339] [cursor=pointer]: 00:42:12
            - button "Copiar link a este momento" [ref=f26e1340] [cursor=pointer]
            - strong [ref=f26e1344]: "Julián Ortiz:"
            - text: Y que desconfíe de los links y de las respuestas largas y prolijas con muchos artículos citados. Que pida la fuente y la abra. Si no abre o es otra norma, descarte la respuesta entera.
          - paragraph [ref=f26e1345]:
            - button "Saltar a 00:42:30" [ref=f26e1346] [cursor=pointer]: 00:42:30
            - button "Copiar link a este momento" [ref=f26e1347] [cursor=pointer]
            - strong [ref=f26e1351]: "Martín Albarracín:"
            - text: Qué cambia y qué no.
          - paragraph [ref=f26e1352]:
            - button "Saltar a 00:42:34" [ref=f26e1353] [cursor=pointer]: 00:42:34
            - button "Copiar link a este momento" [ref=f26e1354] [cursor=pointer]
            - strong [ref=f26e1358]: "Lucía Ferreyra:"
            - text: "Lo que cambia: una persona sin abogado puede entender qué dice una norma a las once de la noche, en lenguaje claro, y eso antes no existía. Lo que no cambia: el dato exacto, el plazo, el artículo, el link, sigue estando solamente en la fuente oficial, y nadie, ni el modelo ni el usuario, puede saltearse el paso de ir a buscarlo."
          - paragraph [ref=f26e1359]:
            - button "Saltar a 00:43:02" [ref=f26e1360] [cursor=pointer]: 00:43:02
            - button "Copiar link a este momento" [ref=f26e1361] [cursor=pointer]
            - strong [ref=f26e1365]: "Ana Paula Sosa:"
            - text: "Y agregaría lo que empeora si no se hace nada: respuestas con aspecto oficial, con links con aspecto oficial, circulando sin que nadie sepa que son inventadas. Eso ya pasa, y va a pasar más."
          - paragraph [ref=f26e1366]:
            - button "Saltar a 00:43:20" [ref=f26e1367] [cursor=pointer]: 00:43:20
            - button "Copiar link a este momento" [ref=f26e1368] [cursor=pointer]
            - strong [ref=f26e1372]: "Julián Ortiz:"
            - text: "Y lo que mejoraría con una sola decisión pública: un benchmark argentino, abierto, mantenido. No es caro. Es trabajo de gente como Ana Paula, con tiempo pago."
          - paragraph [ref=f26e1373]:
            - button "Saltar a 00:43:35" [ref=f26e1374] [cursor=pointer]: 00:43:35
            - button "Copiar link a este momento" [ref=f26e1375] [cursor=pointer]
            - strong [ref=f26e1379]: "Martín Albarracín:"
            - text: Lo anotamos como propuesta concreta y como caso para seguir.
          - heading "Cierre y fuentes" [level=2] [ref=f26e1380]
          - paragraph [ref=f26e1381]:
            - button "Saltar a 00:44:00" [ref=f26e1382] [cursor=pointer]: 00:44:00
            - button "Copiar link a este momento" [ref=f26e1383] [cursor=pointer]
            - strong [ref=f26e1387]: "Lucía Ferreyra:"
            - text: "Fuentes del episodio, todas en la página. El Código Civil y Comercial, la Ley 27.275 y la Ley 24.240 en InfoLEG, que son las normas de las que salieron la mayoría de las preguntas. InfoLEG como base contra la que se verificó cada respuesta. Y el paper de Stanford y Yale sobre alucinaciones legales, del que adaptamos la tipología de errores. Además, publicadas aparte: las sesenta preguntas con su respuesta correcta y link, las doscientas cuarenta respuestas sin editar y la planilla de evaluación."
          - paragraph [ref=f26e1388]:
            - button "Saltar a 00:44:38" [ref=f26e1389] [cursor=pointer]: 00:44:38
            - button "Copiar link a este momento" [ref=f26e1390] [cursor=pointer]
            - strong [ref=f26e1394]: "Martín Albarracín:"
            - text: "Cómo usamos IA en este episodio: los cuatro chatbots son el objeto de la prueba. La transcripción es automática y la revisó Lucía. El borrador del resumen y de los capítulos lo generó un modelo y lo corregimos. Las preguntas las escribió Ana Paula sin IA, la evaluación la hizo Ana Paula sin IA, y las fuentes y conclusiones son nuestras."
          - paragraph [ref=f26e1395]:
            - button "Saltar a 00:45:05" [ref=f26e1396] [cursor=pointer]: 00:45:05
            - button "Copiar link a este momento" [ref=f26e1397] [cursor=pointer]
            - strong [ref=f26e1401]: "Lucía Ferreyra:"
            - text: "Si alguien encuentra un error en la evaluación de alguna pregunta, la planilla tiene un número por fila: escribinos con ese número y lo revisamos en público."
          - paragraph [ref=f26e1402]:
            - button "Saltar a 00:45:18" [ref=f26e1403] [cursor=pointer]: 00:45:18
            - button "Copiar link a este momento" [ref=f26e1404] [cursor=pointer]
            - strong [ref=f26e1408]: "Ana Paula Sosa:"
            - text: Y si alguna universidad u organismo quiere tomar las sesenta preguntas como base para algo más grande, son de uso libre.
          - paragraph [ref=f26e1409]:
            - button "Saltar a 00:45:28" [ref=f26e1410] [cursor=pointer]: 00:45:28
            - button "Copiar link a este momento" [ref=f26e1411] [cursor=pointer]
            - strong [ref=f26e1415]: "Julián Ortiz:"
            - text: Yo pongo el código de la recolección. Está publicado.
          - paragraph [ref=f26e1416]:
            - button "Saltar a 00:45:34" [ref=f26e1417] [cursor=pointer]: 00:45:34
            - button "Copiar link a este momento" [ref=f26e1418] [cursor=pointer]
            - strong [ref=f26e1422]: "Martín Albarracín:"
            - text: Gracias a los dos.
          - paragraph [ref=f26e1423]:
            - button "Saltar a 00:45:37" [ref=f26e1424] [cursor=pointer]: 00:45:37
            - button "Copiar link a este momento" [ref=f26e1425] [cursor=pointer]
            - strong [ref=f26e1429]: "Ana Paula Sosa:"
            - text: Gracias.
          - paragraph [ref=f26e1430]:
            - button "Saltar a 00:45:39" [ref=f26e1431] [cursor=pointer]: 00:45:39
            - button "Copiar link a este momento" [ref=f26e1432] [cursor=pointer]
            - strong [ref=f26e1436]: "Julián Ortiz:"
            - text: Gracias.
          - paragraph [ref=f26e1437]:
            - button "Saltar a 00:45:42" [ref=f26e1438] [cursor=pointer]: 00:45:42
            - button "Copiar link a este momento" [ref=f26e1439] [cursor=pointer]
            - strong [ref=f26e1443]: "Lucía Ferreyra:"
            - text: Esto fue Señal Pública. Hasta el próximo episodio.
